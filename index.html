<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albert Facility PRO - Cyberpunk Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { display: none; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-text-blue { text-shadow: 0 0 10px rgba(56, 189, 248, 0.8); }
        .neon-text-green { text-shadow: 0 0 10px rgba(52, 211, 153, 0.8); }
    </style>
</head>
<body class="bg-[#050b14] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#050b14] to-black text-slate-100 p-4 font-sans text-sm pb-10 min-h-screen">

    <div class="max-w-md mx-auto glass-panel rounded-[2rem] shadow-[0_0_50px_-15px_rgba(56,189,248,0.3)] overflow-hidden relative">
        
        <!-- AUTO-SYNC STATUS -->
        <div id="sync-badge" class="absolute top-3 right-3 text-[9px] bg-rose-600/80 backdrop-blur-md text-white px-3 py-1 rounded-full hidden animate-pulse border border-rose-400 shadow-[0_0_10px_rgba(225,29,72,0.6)] z-50">
            ⚠ CLOUD SYNC PENDING
        </div>

        <!-- DASHBOARD (Hlavička) -->
        <div class="bg-gradient-to-r from-blue-900/50 to-cyan-900/30 p-5 border-b border-cyan-500/20 flex justify-between items-center">
            <div>
                <div class="text-[9px] text-cyan-400 uppercase font-black tracking-widest mb-1 opacity-80">Měsíční cyklus</div>
                <div class="text-2xl font-digital font-bold text-white neon-text-blue" id="stat-hodiny">0h 0m</div>
            </div>
            <div class="text-right">
                <div class="text-[9px] text-emerald-400 uppercase font-black tracking-widest mb-1 opacity-80">Rozpočet</div>
                <div class="text-2xl font-digital font-bold text-emerald-400 neon-text-green" id="stat-naklady">0 Kč</div>
            </div>
        </div>

        <div class="p-6 space-y-6">
            <!-- Datum a Chytrá Prodejna -->
            <div class="grid grid-cols-2 gap-4">
                <div class="relative group">
                    <label class="block text-[9px] font-black text-slate-400 uppercase tracking-wider mb-2 ml-1">Datum</label>
                    <input type="date" id="datum-prace" class="w-full bg-slate-800/50 border border-slate-600/50 p-3 rounded-2xl text-cyan-100 outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.3)] transition-all">
                </div>
                <div class="relative group">
                    <label class="block text-[9px] font-black text-slate-400 uppercase tracking-wider mb-2 ml-1 flex justify-between">
                        <span>Lokalita</span> 
                        <span id="auto-lokace" class="text-emerald-400 text-[9px] hidden font-bold animate-pulse neon-text-green">LOCKED</span>
                    </label>
                    <select id="prodejna" class="w-full bg-slate-800/50 border border-slate-600/50 p-3 rounded-2xl text-cyan-100 outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.3)] transition-all">
                        <option value="">Skenuji oblast...</option>
                        <optgroup label="Třebíč a okolí">
                            <option value="171">171 - Třebíč</option><option value="851">851 - Třebíč</option>
                            <option value="403">403 - Třebíč</option><option value="735">735 - Třebíč</option>
                            <option value="Okříšky">Okříšky</option>
                        </optgroup>
                        <optgroup label="Brno a okolí">
                            <option value="025">025 - Brno</option><option value="022">022 - Brno</option>
                            <option value="026">026 - Brno</option><option value="125">125 - Rosice</option>
                        </optgroup>
                        <optgroup label="Jindřichův Hradec">
                            <option value="354">354 - J. Hradec</option><option value="334">334 - J. Hradec</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <!-- Cestovné a Náklady -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-800/50 border border-slate-600/50 p-3 rounded-2xl flex items-center focus-within:border-cyan-400 focus-within:shadow-[0_0_15px_rgba(34,211,238,0.3)] transition-all">
                    <span class="text-lg pl-1 pr-2 opacity-70">🚗</span>
                    <input type="number" id="kilometry" placeholder="KM" class="w-full bg-transparent text-white outline-none font-bold placeholder-slate-500">
                </div>
                <div class="bg-slate-800/50 border border-slate-600/50 p-3 rounded-2xl flex items-center focus-within:border-emerald-400 focus-within:shadow-[0_0_15px_rgba(52,211,153,0.3)] transition-all">
                    <span class="text-lg pl-1 pr-2 opacity-70">💰</span>
                    <input type="number" id="naklady" placeholder="Kč" class="w-full bg-transparent text-white outline-none font-bold placeholder-slate-500">
                </div>
            </div>

            <!-- SMART POPIS PRÁCE -->
            <div class="bg-slate-800/30 p-4 rounded-2xl border border-slate-700/50 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-cyan-500 shadow-[0_0_10px_rgba(6,182,212,0.8)]"></div>
                
                <div class="flex justify-between items-center mb-3 pl-2">
                    <label class="block text-[9px] font-black text-cyan-400 uppercase tracking-widest">Záznam operace</label>
                    <button onclick="spustitDiktovani()" id="btn-mikrofon" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all flex items-center gap-2">
                        <span>🎙️</span> Inicializovat hlas
                    </button>
                </div>

                <div class="flex flex-wrap gap-2 mb-3 pl-2">
                    <button onclick="pridejStitek('Elektro')" class="bg-slate-800 border border-slate-600 hover:border-cyan-400 hover:text-cyan-400 px-3 py-1 rounded-full text-[10px] font-bold transition-all">⚡ Elektro</button>
                    <button onclick="pridejStitek('Dlažba')" class="bg-slate-800 border border-slate-600 hover:border-cyan-400 hover:text-cyan-400 px-3 py-1 rounded-full text-[10px] font-bold transition-all">🧱 Dlažba</button>
                    <button onclick="pridejStitek('Voda')" class="bg-slate-800 border border-slate-600 hover:border-cyan-400 hover:text-cyan-400 px-3 py-1 rounded-full text-[10px] font-bold transition-all">🚰 Voda</button>
                    <button onclick="pridejStitek('Prevence')" class="bg-slate-800 border border-slate-600 hover:border-cyan-400 hover:text-cyan-400 px-3 py-1 rounded-full text-[10px] font-bold transition-all">🔍 Prevence</button>
                </div>

                <select id="sablona" onchange="vlozSablonu()" class="w-full bg-slate-900/50 border border-slate-600/50 p-2.5 rounded-xl text-xs text-slate-300 outline-none mb-3 focus:border-cyan-400 transition-all ml-2 w-[calc(100%-0.5rem)]">
                    <option value="">Databáze šablon...</option>
                    <option value="Oprava dilatačních spár (butylenový tmel).">Oprava podlahy (dilatační spáry)</option>
                    <option value="Výměna osvětlení ve výšce (plošina).">Výměna světel ve výšce</option>
                    <option value="Výměna prasklé dlažby (vybourání, lepení).">Oprava dlažby</option>
                </select>
                
                <textarea id="popis" rows="3" class="w-full bg-black/40 border border-slate-600/50 p-3 rounded-xl text-cyan-50 outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(6,182,212,0.2)] transition-all ml-2 w-[calc(100%-0.5rem)] placeholder-slate-600" placeholder="Čekám na vstupní data..."></textarea>
            </div>

            <!-- Nákupní seznam -->
            <div class="bg-amber-900/20 border border-amber-500/30 p-4 rounded-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.8)]"></div>
                <label class="block text-[9px] font-black text-amber-500 uppercase tracking-widest mb-2 pl-2">🛒 Požadavek na materiál</label>
                <textarea id="poznamka-priste" rows="1" oninput="ulozitNakup()" class="w-full bg-transparent text-amber-100 outline-none placeholder-amber-900/50 pl-2 font-bold" placeholder="Definuj chybějící položky..."></textarea>
            </div>

            <!-- FUTURISTICKÉ STOPKY -->
            <div id="timer-ui" class="bg-[#020617] p-6 rounded-[2rem] text-center border border-cyan-500/30 hidden shadow-[inset_0_0_30px_rgba(6,182,212,0.1)] relative overflow-hidden">
                <div class="absolute -top-10 -left-10 w-32 h-32 bg-cyan-500/20 rounded-full blur-3xl"></div>
                <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-blue-600/20 rounded-full blur-3xl"></div>
                
                <div id="clock" class="text-6xl font-digital font-black text-white tracking-widest neon-text-blue relative z-10">00:00:00</div>
                <div id="gps-status" class="text-[9px] font-bold text-cyan-500 mt-4 tracking-widest uppercase relative z-10">⏳ Inicializace satelitního spojení...</div>
            </div>

            <!-- Tlačítka Start/Stop a Kalendář -->
            <div class="flex flex-col gap-3 pt-2">
                <button id="btn-start" onclick="startPrace()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 py-5 rounded-2xl font-black shadow-[0_0_20px_rgba(16,185,129,0.4)] hover:shadow-[0_0_30px_rgba(16,185,129,0.6)] hover:scale-[1.02] active:scale-95 transition-all text-xl uppercase tracking-widest border border-emerald-400/50">
                    START SEKVENCI
                </button>
                <button id="btn-stop" onclick="stopPrace()" class="hidden w-full bg-gradient-to-r from-rose-600 to-red-600 py-5 rounded-2xl font-black shadow-[0_0_20px_rgba(225,29,72,0.4)] hover:shadow-[0_0_30px_rgba(225,29,72,0.6)] hover:scale-[1.02] active:scale-95 transition-all text-xl uppercase tracking-widest border border-rose-400/50">
                    UKONČIT & ULOŽIT
                </button>
                
                <button id="btn-kalendar" onclick="stahnoutKalendar()" class="hidden w-full bg-slate-800 border border-cyan-500/50 py-4 rounded-2xl font-bold hover:bg-slate-700 hover:shadow-[0_0_15px_rgba(6,182,212,0.3)] active:scale-95 transition-all text-sm uppercase tracking-widest flex items-center justify-center gap-2 text-cyan-400">
                    <span>📅</span> Exportovat do kalendáře
                </button>
            </div>

            <!-- HISTORIE ZÁZNAMŮ -->
            <div class="mt-8 border-t border-slate-700/50 pt-6">
                <h3 class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-4">Systémový log (Poslední záznamy)</h3>
                <div id="historie-seznam" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- ZDE ZAČÍNÁ JAVASCRIPT (Logika zůstává beze změny) -->
    <script>
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxofi-HJn-QOuT_908ccgA74PgfrQm2ZETr4hgOsgtYFCp59KbmOAP18hQ8kjj_brqk/exec";
        
        const SOURADNICE_PRODEJEN = {
            "171": { lat: 49.214, lon: 15.881 }, 
            "851": { lat: 49.215, lon: 15.885 },
            "403": { lat: 49.210, lon: 15.870 },
            "Okříšky": { lat: 49.245, lon: 15.768 },
            "125": { lat: 49.182, lon: 16.388 }, 
            "025": { lat: 49.195, lon: 16.606 }  
        };

        let startTime = null;
        let timerInterval = null;
        let gpsLokace = "Nezjištěna";
        let posledniZaznam = null;

        window.onload = () => {
            document.getElementById('datum-prace').value = new Date().toISOString().split('T')[0];
            document.getElementById('poznamka-priste').value = localStorage.getItem('albert_nakup') || "";
            vypocitejStatistiky();
            vykresliHistorii(); 
            zkusOdeslatFrontu(); 
            najdiPolohuAObchod(); 
            
            if (localStorage.getItem('active_timer')) {
                startTime = new Date(localStorage.getItem('active_timer'));
                rezimBehu();
            }
        };

        function vykresliHistorii() {
            const db = JSON.parse(localStorage.getItem('albert_final_db') || "[]");
            const kontejner = document.getElementById('historie-seznam');
            kontejner.innerHTML = "";
            if (db.length === 0) return kontejner.innerHTML = '<div class="text-xs text-slate-500 italic font-mono">Log je prázdný...</div>';
            
            db.slice(-3).reverse().forEach(z => {
                kontejner.innerHTML += `
                    <div class="glass-panel p-3 rounded-xl border-l-2 border-l-cyan-500">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold text-cyan-300">Albert ${z.prodejna}</span>
                            <span class="text-[10px] text-slate-400 font-mono">${z.datum} | ${z.trvani}m</span>
                        </div>
                        <div class="text-xs text-slate-300 truncate">${z.popis}</div>
                    </div>`;
            });
        }

        function vypocitejStatistiky() {
            const db = JSON.parse(localStorage.getItem('albert_final_db') || "[]");
            const aktualniMesic = new Date().toISOString().slice(0, 7);
            let min = 0, kc = 0;
            db.forEach(z => {
                if (z.datum.startsWith(aktualniMesic)) {
                    min += parseInt(z.trvani) || 0;
                    kc += parseInt(z.naklady) || 0;
                }
            });
            document.getElementById('stat-hodiny').innerText = `${Math.floor(min / 60)}h ${min % 60}m`;
            document.getElementById('stat-naklady').innerText = `${kc} Kč`;
        }

        function ulozitNakup() { localStorage.setItem('albert_nakup', document.getElementById('poznamka-priste').value); }
        function vibruj() { if (navigator.vibrate) navigator.vibrate(100); }

        function pridejStitek(text) {
            const pole = document.getElementById('popis');
            pole.value = pole.value ? pole.value + " [" + text + "]" : "[" + text + "]";
        }

        function vlozSablonu() {
            const vybrana = document.getElementById('sablona').value;
            if(vybrana) {
                const pole = document.getElementById('popis');
                pole.value = pole.value ? pole.value + " " + vybrana : vybrana;
                document.getElementById('sablona').value = ""; 
            }
        }

        function spustitDiktovani() {
            vibruj();
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Prohlížeč nepodporuje diktování.");
            const rozpoznavani = new SpeechRecognition();
            rozpoznavani.lang = 'cs-CZ';
            const btn = document.getElementById('btn-mikrofon');
            
            rozpoznavani.onstart = () => { 
                btn.innerHTML = '🔴 Příjem audia...'; 
                btn.classList.replace('from-cyan-600', 'from-rose-600');
                btn.classList.replace('to-blue-600', 'to-red-600');
            };
            rozpoznavani.onresult = (e) => {
                const pole = document.getElementById('popis');
                pole.value = pole.value ? pole.value + " " + e.results[0][0].transcript : e.results[0][0].transcript;
            };
            rozpoznavani.onend = () => { 
                btn.innerHTML = '🎙️ Inicializovat hlas'; 
                btn.classList.replace('from-rose-600', 'from-cyan-600');
                btn.classList.replace('to-red-600', 'to-blue-600');
            };
            rozpoznavani.start();
        }

        function vypocitejVzdalenost(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function najdiPolohuAObchod() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    p => {
                        const lat = p.coords.latitude;
                        const lon = p.coords.longitude;
                        gpsLokace = `https://maps.google.com/?q=${lat},${lon}`;
                        
                        let nejblizsi = null;
                        let minVzdalenost = 5; 

                        for (const [id, coords] of Object.entries(SOURADNICE_PRODEJEN)) {
                            let dist = vypocitejVzdalenost(lat, lon, coords.lat, coords.lon);
                            if (dist < minVzdalenost) { 
                                minVzdalenost = dist; 
                                nejblizsi = id; 
                            }
                        }

                        if (nejblizsi) {
                            const select = document.getElementById('prodejna');
                            select.value = nejblizsi;
                            select.classList.replace('bg-slate-800/50', 'bg-emerald-900/30');
                            select.classList.replace('border-slate-600/50', 'border-emerald-500/50');
                            document.getElementById('auto-lokace').classList.remove('hidden');
                            document.getElementById('gps-status').innerHTML = `📍 CÍL ZAMĚŘEN: ${minVzdalenost.toFixed(1)} km od [${nejblizsi}]`;
                            document.getElementById('gps-status').className = "text-[9px] mt-4 font-bold text-emerald-400 tracking-widest uppercase relative z-10";
                        } else {
                            document.getElementById('gps-status').innerHTML = `📍 LOKACE ZAMĚŘENA (MIMO ZÓNU)`;
                        }
                    },
                    e => { document.getElementById('gps-status').innerText = "⚠️ GPS OFFLINE"; },
                    { enableHighAccuracy: true }
                );
            }
        }

        async function zkusOdeslatFrontu() {
            let fronta = JSON.parse(localStorage.getItem('albert_sync_fronta') || "[]");
            if (fronta.length === 0) return;
            
            document.getElementById('sync-badge').classList.remove('hidden');
            let zbyvaVeFronte = [];
            for (let zaznam of fronta) {
                try {
                    await fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(zaznam) });
                } catch (e) { zbyvaVeFronte.push(zaznam); }
            }
            localStorage.setItem('albert_sync_fronta', JSON.stringify(zbyvaVeFronte));
            if (zbyvaVeFronte.length === 0) document.getElementById('sync-badge').classList.add('hidden');
        }

        function startPrace() {
            vibruj();
            startTime = new Date();
            localStorage.setItem('active_timer', startTime.toISOString());
            document.getElementById('btn-kalendar').classList.add('hidden'); 
            rezimBehu();
            najdiPolohuAObchod();
        }

        function rezimBehu() {
            document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('btn-stop').classList.remove('hidden');
            document.getElementById('timer-ui').classList.remove('hidden');
            timerInterval = setInterval(() => {
                const diff = new Date(new Date() - startTime);
                document.getElementById('clock').innerText = diff.toISOString().substr(11, 8);
            }, 1000);
        }

        function stopPrace() {
            vibruj();
            const endTime = new Date();
            const popis = document.getElementById('popis').value;
            const prodejna = document.getElementById('prodejna').value;
            if (!popis || !prodejna) return alert("Chyba: Zadej popis a prodejnu!");

            const zaznam = {
                datum: document.getElementById('datum-prace').value,
                prodejna: prodejna,
                popis: popis,
                naklady: document.getElementById('naklady').value || 0,
                kilometry: document.getElementById('kilometry').value || 0,
                kategorie: "Toyota Proace City", 
                poznamka: document.getElementById('poznamka-priste').value,
                poloha: gpsLokace,
                od: startTime.toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit'}),
                do: endTime.toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit'}),
                trvani: Math.round((endTime - startTime) / 60000)
            };

            posledniZaznam = { ...zaznam, start: startTime, konec: endTime }; 

            const db = JSON.parse(localStorage.getItem('albert_final_db') || "[]");
            db.push(zaznam);
            localStorage.setItem('albert_final_db', JSON.stringify(db));

            let fronta = JSON.parse(localStorage.getItem('albert_sync_fronta') || "[]");
            fronta.push(zaznam);
            localStorage.setItem('albert_sync_fronta', JSON.stringify(fronta));
            zkusOdeslatFrontu();

            localStorage.removeItem('active_timer');
            clearInterval(timerInterval);
            document.getElementById('btn-start').classList.remove('hidden');
            document.getElementById('btn-stop').classList.add('hidden');
            document.getElementById('timer-ui').classList.add('hidden');
            document.getElementById('popis').value = "";
            
            vypocitejStatistiky();
            vykresliHistorii(); 
            
            document.getElementById('btn-kalendar').classList.remove('hidden');
            
            const btnStop = document.getElementById('btn-stop');
            btnStop.innerText = "✅ DATA ULOŽENA";
            setTimeout(() => { btnStop.innerText = "UKONČIT & ULOŽIT"; }, 2000);
        }

        function stahnoutKalendar() {
            if (!posledniZaznam) return;
            vibruj();
            
            const f = (d) => d.toISOString().replace(/-|:|\.\d+/g, "");
            const ics = [
                "BEGIN:VCALENDAR", "VERSION:2.0", "BEGIN:VEVENT",
                `DTSTART:${f(posledniZaznam.start)}`,
                `DTEND:${f(posledniZaznam.konec)}`,
                `SUMMARY:Údržba: Albert ${posledniZaznam.prodejna}`,
                `DESCRIPTION:Provedená práce: ${posledniZaznam.popis}\\n\\nCestovné: ${posledniZaznam.kilometry} km\\nNáklady: ${posledniZaznam.naklady} Kč`,
                "END:VEVENT", "END:VCALENDAR"
            ].join("\n");
            
            const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Albert_${posledniZaznam.prodejna}_${posledniZaznam.datum}.ics`;
            a.click();
            
            document.getElementById('btn-kalendar').classList.add('hidden');
        }
    </script>
</body>
</html>
