<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    <title>Kamil Facility SUPREME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { font-family: 'Inter', sans-serif; background: #020617; color: #e2e8f0; -webkit-tap-highlight-color: transparent; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .mic-active { animation: pulse-red 1.5s infinite; background: #ef4444 !important; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .toast-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="p-4 pb-32">

    <div id="toast-container" class="fixed bottom-6 left-0 right-0 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>

    <div class="max-w-md mx-auto space-y-6">
        
        <div class="glass rounded-[2rem] p-6 shadow-2xl relative overflow-hidden border-t-2 border-sky-500/50">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-sky-500/20 rounded-full blur-3xl"></div>
            <div class="flex justify-between items-start mb-4 relative z-10">
                <div>
                    <h1 class="text-[9px] font-black tracking-widest uppercase opacity-40 mb-1 flex items-center gap-2">
                        <span id="gps-status" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_#34d399]"></span> 
                        GPS Autopilot Aktivní
                    </h1>
                    <div class="text-4xl font-digital font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400" id="stat-hodiny">0h 0m</div>
                    <div class="text-[11px] text-emerald-400 font-bold mt-1 tracking-wider" id="stat-penize">0 Kč</div>
                </div>
                <button onclick="vymazatData()" class="bg-rose-500/10 text-rose-400 text-[9px] px-3 py-1.5 rounded-full border border-rose-500/20 font-bold uppercase active:scale-90">Reset</button>
            </div>
            <div class="flex gap-2 border-t border-white/10 pt-4 relative z-10 text-[10px] font-bold">
                <button onclick="exportCSV()" class="flex-1 bg-emerald-600/20 py-2 rounded-xl text-emerald-400 border border-emerald-500/20 uppercase">📊 Export</button>
                <button onclick="zalohovatData()" class="flex-1 bg-slate-800 py-2 rounded-xl text-sky-400 uppercase">💾 Záloha</button>
            </div>
        </div>

        <div class="glass rounded-[2rem] p-6 space-y-4 border-t-2 border-rose-500/50">
            <h2 class="text-xs font-black uppercase tracking-widest text-rose-400 flex items-center gap-2">🚨 AI Skener MWDIAS</h2>
            
            <div class="grid grid-cols-2 gap-2">
                <button onclick="document.getElementById('ocr-upload').click()" class="bg-rose-600/20 border border-rose-500/30 py-4 rounded-xl text-[10px] font-bold uppercase text-rose-300 flex flex-col items-center gap-1 active:scale-95 transition-all">
                    <span>📸 Nahrát Screenshot</span>
                    <input type="file" id="ocr-upload" class="hidden" accept="image/*" onchange="skenujObrazek(event)">
                </button>
                <button onclick="document.getElementById('ir-text').focus()" class="bg-slate-800 border border-slate-700 py-4 rounded-xl text-[10px] font-bold uppercase text-slate-300 flex flex-col items-center gap-1 active:scale-95 transition-all">
                    <span>✍️ Vložit text</span>
                </button>
            </div>
            
            <textarea id="ir-text" rows="2" class="w-full bg-slate-900 border border-rose-900/50 p-4 rounded-xl text-xs outline-none focus:border-rose-500 text-slate-200 transition-all shadow-inner" placeholder="Sem vlož text nebo použij skener..."></textarea>
            
            <button onclick="zpracujIR()" id="btn-analyzovat" class="w-full bg-rose-600 hover:bg-rose-500 py-4 rounded-xl font-black text-xs uppercase text-white shadow-lg active:scale-95 transition-all">Analyzovat úkol</button>

            <div id="seznam-ir" class="space-y-3 pt-2"></div>
        </div>

        <div class="glass rounded-[2rem] p-6 space-y-5" id="denik-sekce">
            <h2 class="text-xs font-black uppercase tracking-widest text-sky-500">📓 Pracovní Deník</h2>
            <div class="grid grid-cols-2 gap-3">
                <input type="date" id="datum-prace" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-xs outline-none focus:border-sky-500 text-slate-200">
                <select id="prodejna" onchange="nahrajAN()" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-xs outline-none focus:border-sky-500 font-bold text-slate-200">
                    <option value="171 - TŘEBÍČ">171 - Třebíč</option>
                    <option value="851 - TŘEBÍČ">851 - Třebíč</option>
                    <option value="403 - TŘEBÍČ">403 - Třebíč</option>
                    <option value="025 - BRNO">025 - Brno</option>
                    <option value="OKŘÍŠKY">Okříšky</option>
                </select>
            </div>
            
            <div class="relative">
                <textarea id="popis" rows="3" oninput="aiDetekceMaterialu()" class="w-full bg-slate-900 border border-slate-700 p-4 pr-12 rounded-xl text-sm outline-none focus:border-sky-500 text-slate-200" placeholder="Co jsi dělal?"></textarea>
                <button id="mic-popis" onclick="toggleDiktovani('popis')" class="absolute right-2 top-2 w-12 h-12 bg-slate-800 rounded-lg flex items-center justify-center text-2xl">🎙️</button>
            </div>
            
            <input id="material" type="text" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-sm outline-none focus:border-sky-500 text-emerald-300" placeholder="Materiál (AI doplní)...">
            
            <div class="flex gap-3">
                <button onclick="ulozZaznam_Manualni()" class="flex-1 bg-slate-800 py-4 rounded-2xl font-bold text-xs uppercase text-slate-300 border border-slate-700">Ručně</button>
                <button onclick="spustitNeznicitelneStopky()" id="btn-stopky" class="flex-[2] bg-gradient-to-r from-emerald-600 to-teal-500 py-4 rounded-2xl font-black text-xs uppercase shadow-xl active:scale-95 text-white">⏱️ START / STOP</button>
            </div>
            
            <div id="seznam-zaznamu" class="space-y-2 max-h-48 overflow-y-auto mt-2 pr-1"></div>
        </div>

        <div class="glass rounded-[2rem] p-6 bg-amber-500/5 border-amber-500/20 space-y-4">
            <h2 class="text-xs font-black text-amber-500 uppercase tracking-widest flex justify-between items-center">🖨️ PDF Automat</h2>
            <input type="file" id="pdf-template" accept="application/pdf" class="hidden" onchange="ulozitVzor(event)">
            <label for="pdf-template" id="vzor-label" class="cursor-pointer block text-center p-3 border border-dashed border-amber-500/30 rounded-xl text-[10px] text-amber-500 uppercase hover:bg-amber-500/10">1. Nahraj vzor PDF</label>
            <div class="flex gap-2">
                <input type="text" id="ai-cislo-an" onchange="ulozAN()" placeholder="Číslo AH (Ap...)" class="flex-1 bg-slate-900 border border-slate-700 p-4 rounded-xl text-sm font-bold text-amber-100 outline-none">
                <select id="gen-mesic" class="bg-slate-900 border border-slate-700 p-4 rounded-xl text-sm font-bold text-amber-100 outline-none w-20 text-center"></select>
            </div>
            <button id="btn-vygenerovat" onclick="vygenerujAlbertPDF()" class="w-full bg-gradient-to-r from-amber-600 to-orange-500 py-5 rounded-2xl font-black text-sm uppercase tracking-widest active:scale-95 shadow-xl">2. Vytvořit a Sdílet PDF</button>
        </div>
    </div>

    <script>
        let isListening = false; let recognition = null; let zacatekStopek = null;
        const LOKACE_GPS = { "171 - TŘEBÍČ": { lat: 49.214, lon: 15.881 }, "851 - TŘEBÍČ": { lat: 49.210, lon: 15.890 }, "403 - TŘEBÍČ": { lat: 49.220, lon: 15.875 }, "025 - BRNO": { lat: 49.195, lon: 16.606 }, "OKŘÍŠKY": { lat: 49.248, lon: 15.768 } };
        const ALBERT_CILY = { "171": { udrzba: 15, tech: 4, den: 5 }, "851": { udrzba: 16, tech: 16, den: 2 }, "403": { udrzba: 12, tech: 7, den: 4 }, "025": { udrzba: 2, tech: 1, den: 3 }, "OKŘÍŠKY": { udrzba: 2, tech: 1, den: 4 } };

        function vibrace(ms = 50) { if (navigator.vibrate) navigator.vibrate(ms); }
        function ukazToast(zprava, typ = 'success') {
            const c = document.getElementById('toast-container'); const t = document.createElement('div');
            t.className = `${typ === 'success' ? 'bg-emerald-500' : 'bg-rose-500'} text-white px-6 py-3 rounded-full text-[10px] font-bold shadow-2xl toast-enter flex items-center gap-2 border border-white/10`;
            t.innerHTML = (typ === 'success' ? '✅ ' : '⚠️ ') + zprava;
            c.appendChild(t); setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000); vibrace();
        }

        // --- 📸 AI SKENER OBRAZŮ (OCR) ---
        async function skenujObrazek(event) {
            const file = event.target.files[0]; if(!file) return;
            const btn = document.getElementById('btn-analyzovat');
            btn.innerHTML = "<span class='animate-pulse'>⏳ AI ČTE OBRÁZEK...</span>";
            ukazToast("AI zpracovává screenshot...");

            try {
                const result = await Tesseract.recognize(file, 'ces', { logger: m => console.log(m) });
                document.getElementById('ir-text').value = result.data.text;
                ukazToast("Text úspěšně načten!");
                zpracujIR(); // Rovnou to zkusíme zanalyzovat
            } catch (e) {
                ukazToast("Chyba při čtení obrázku", "error");
            } finally {
                btn.innerHTML = "Analyzovat úkol";
            }
        }

        window.onload = () => {
            const dnes = new Date(); document.getElementById('datum-prace').value = dnes.toISOString().split('T')[0];
            const selectMesic = document.getElementById('gen-mesic');
            for(let i=1; i<=12; i++) { let opt = document.createElement('option'); opt.value = i; opt.text = i; if(i === dnes.getMonth() + 1) opt.selected = true; selectMesic.appendChild(opt); }
            vypocitejStatistiky(); vykresliDenik(); vykresliIR();
            if (localStorage.getItem('tsc_vzor_pdf')) document.getElementById('vzor-status-ikona').innerText = "✅";
            checkAutoGPS(); nahrajAN();

            if (localStorage.getItem('kamil_aktivni_stopky')) {
                zacatekStopek = new Date(localStorage.getItem('kamil_aktivni_stopky'));
                const b = document.getElementById('btn-stopky'); b.innerHTML = "⏹️ UKONČIT STOPKY"; b.classList.replace('from-emerald-600', 'from-rose-600'); b.classList.replace('to-teal-500', 'to-red-500'); b.classList.add('animate-pulse');
            }
        };

        // --- GPS & OSTATNÍ LOGIKA ---
        function spocitejVzdalenost(lat1, lon1, lat2, lon2) { const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180; const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2); return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); }
        function checkAutoGPS() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(pos => {
                let nejblizsi = ""; let minVzdalenost = Infinity;
                for (const [jmeno, coords] of Object.entries(LOKACE_GPS)) {
                    const dist = spocitejVzdalenost(pos.coords.latitude, pos.coords.longitude, coords.lat, coords.lon);
                    if (dist < minVzdalenost) { minVzdalenost = dist; nejblizsi = jmeno; }
                }
                if (nejblizsi && minVzdalenost < 30) { document.getElementById('prodejna').value = nejblizsi; nahrajAN(); }
            }, null, { timeout: 5000 });
        }

        function zpracujIR() {
            const text = document.getElementById('ir-text').value; if(!text) return;
            let barak = "Neznámý";
            if(text.includes("171")) barak = "171 - TŘEBÍČ"; else if(text.includes("851")) barak = "851 - TŘEBÍČ"; else if(text.includes("403")) barak = "403 - TŘEBÍČ";
            let termDate = new Date(); const dateMatch = text.match(/(\d{1,2})\s*\.\s*(\d{1,2})/);
            if(dateMatch) termDate = new Date(new Date().getFullYear(), parseInt(dateMatch[2])-1, parseInt(dateMatch[1]), 10, 0);
            const dbIR = JSON.parse(localStorage.getItem('kamil_ir_db') || "[]");
            dbIR.push({ text: text, prodejna: barak, termDate: termDate.toISOString(), origDate: dateMatch ? dateMatch[0] : "ASAP" });
            localStorage.setItem('kamil_ir_db', JSON.stringify(dbIR)); document.getElementById('ir-text').value = ''; vykresliIR(); ukazToast("AI: Úkol načten!");
        }

        function vykresliIR() {
            const dbIR = JSON.parse(localStorage.getItem('kamil_ir_db') || "[]");
            document.getElementById('seznam-ir').innerHTML = dbIR.map((ir, i) => `
                <div class="bg-rose-950/20 border border-rose-900/50 p-4 rounded-xl">
                    <span class="text-[10px] font-bold text-rose-300 block">${ir.prodejna} | Termín: ${ir.origDate}</span>
                    <span class="text-[10px] text-slate-300 line-clamp-1">${ir.text}</span>
                    <div class="flex gap-2 mt-3">
                        <button onclick="doKalendareICS(${i})" class="flex-1 bg-blue-600/20 py-2 rounded-lg text-[9px] font-bold text-blue-300 uppercase">📅 Kalendář</button>
                        <button onclick="splnitIR(${i})" class="flex-1 bg-emerald-600/20 py-2 rounded-lg text-[9px] font-bold text-emerald-300 uppercase">✅ Hotovo</button>
                    </div>
                </div>
            `).join('');
        }

        function doKalendareICS(i) {
            const ir = JSON.parse(localStorage.getItem('kamil_ir_db'))[i];
            const startD = new Date(ir.termDate); const endD = new Date(startD.getTime() + 7200000);
            const ics = ["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",`DTSTART:${startD.toISOString().replace(/-|:/g, '').split('.')[0]}Z`,`DTEND:${endD.toISOString().replace(/-|:/g, '').split('.')[0]}Z`,`SUMMARY:Albert ${ir.prodejna.split('-')[0]} - Úkol`,`DESCRIPTION:${ir.text.replace(/\n/g, '\\n')}`,"END:VEVENT","END:VCALENDAR"].join("\n");
            const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); link.download = "ukol.ics"; link.click();
        }

        function splnitIR(i) {
            const ir = JSON.parse(localStorage.getItem('kamil_ir_db'))[i];
            document.getElementById('prodejna').value = ir.prodejna; document.getElementById('popis').value = `Zásah: ${ir.text.substring(0, 40)}...`;
            const db = JSON.parse(localStorage.getItem('kamil_ir_db')); db.splice(i, 1); localStorage.setItem('kamil_ir_db', JSON.stringify(db)); vykresliIR();
            document.getElementById('denik-sekce').scrollIntoView({ behavior: 'smooth' });
        }

        function spustitNeznicitelneStopky() {
            const btn = document.getElementById('btn-stopky');
            if (zacatekStopek) {
                let m = Math.round((new Date() - zacatekStopek) / 60000); zacatekStopek = null; localStorage.removeItem('kamil_aktivni_stopky');
                btn.innerHTML = "⏱️ START / STOP"; btn.classList.replace('from-rose-600', 'from-emerald-600'); btn.classList.remove('animate-pulse'); ulozZaznam(m || 1);
            } else {
                zacatekStopek = new Date(); localStorage.setItem('kamil_aktivni_stopky', zacatekStopek.toISOString());
                btn.innerHTML = "⏹️ UKONČIT STOPKY"; btn.classList.replace('from-emerald-600', 'from-rose-600'); btn.classList.add('animate-pulse');
            }
        }

        function ulozZaznam(m) {
            const p = document.getElementById('popis').value; if(!p) return;
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            db.push({ datum: document.getElementById('datum-prace').value, prodejna: document.getElementById('prodejna').value, popis: p, material: document.getElementById('material').value, trvani: m });
            localStorage.setItem('kamil_denik_db', JSON.stringify(db)); document.getElementById('popis').value = ''; document.getElementById('material').value = '';
            vypocitejStatistiky(); vykresliDenik(); ukazToast("Uloženo");
        }

        function vykresliDenik() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            document.getElementById('seznam-zaznamu').innerHTML = db.slice(-3).reverse().map((z, i) => `<div class="bg-slate-900/40 p-3 rounded-xl flex justify-between items-center text-[10px] border border-slate-800"><div><span class="text-sky-400 font-bold">${z.datum.split('-').reverse().join('.')}</span> | ${z.prodejna.split(' ')[0]}<br>${z.popis}</div><button onclick="smazatZaznam(${db.length-1-i})" class="text-rose-500 p-2 font-bold opacity-50">✕</button></div>`).join('');
        }

        function exportCSV() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]"); if(db.length===0) return;
            let csv = "Datum,Lokalita,Popis,Material,Hodiny\n"; db.forEach(z => { csv += `"${z.datum}","${z.prodejna}","${z.popis}","${z.material}","${(z.trvani/60).toFixed(1)}"\n`; });
            const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob(["\uFEFF"+csv], {type: "text/csv"})); link.download = `Vykaz_Kamil.csv`; link.click();
        }

        function ulozAN() { localStorage.setItem('AN_' + document.getElementById('prodejna').value.split('-')[0].trim(), document.getElementById('ai-cislo-an').value); }
        function nahrajAN() { document.getElementById('ai-cislo-an').value = localStorage.getItem('AN_' + document.getElementById('prodejna').value.split('-')[0].trim()) || ''; }
        function vypocitejStatistiky() { const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]"); let m = 0; db.forEach(z => { m += z.trvani; }); document.getElementById('stat-hodiny').innerText = `${Math.floor(m/60)}h ${m%60}m`; document.getElementById('stat-penize').innerText = (Math.floor(m/60) * 350).toLocaleString() + " Kč"; }
        function adjust(key, v) { let n = parseInt(localStorage.getItem(key) || (key==='cal_y'?525:60)) + v; localStorage.setItem(key, n); document.getElementById(key==='cal_y'?'val-y':'val-x').innerText = n; }
        function ulozitVzor(e) { const r = new FileReader(); r.onload = (evt) => { localStorage.setItem('tsc_vzor_pdf', evt.target.result); location.reload(); }; r.readAsDataURL(e.target.files[0]); }
        async function vygenerujAlbertPDF() {
            const base64 = localStorage.getItem('tsc_vzor_pdf'); if(!base64) return;
            const pdfDoc = await PDFLib.PDFDocument.load(await fetch(base64).then(res => res.arrayBuffer()));
            const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
            const page = pdfDoc.getPages()[0];
            const pId = document.getElementById('prodejna').value.split('-')[0].trim(); const mes = document.getElementById('gen-mesic').value;
            page.drawText(pId, { x: 235, y: 668, size: 12, font: font }); page.drawText(`${mes} / 2026`, { x: 670, y: 668, size: 12, font: font }); page.drawText('BALCAR', { x: 235, y: 642, size: 10, font: font });
            const pdfBytes = await pdfDoc.save(); const file = new File([pdfBytes], `Vykaz_${pId}.pdf`, { type: 'application/pdf' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); } else { const link = document.createElement('a'); link.href = URL.createObjectURL(file); link.download = file.name; link.click(); }
        }
    </script>
</body>
</html>
