<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albert Facility PRO - Originál PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-text-blue { text-shadow: 0 0 10px rgba(56, 189, 248, 0.8); }
        .neon-text-orange { text-shadow: 0 0 10px rgba(249, 115, 22, 0.8); }
        .toggle-checkbox:checked { right: 0; border-color: #f97316; }
        .toggle-checkbox:checked + .toggle-label { background-color: #c2410c; }
    </style>
</head>
<body class="bg-[#050b14] text-slate-100 p-4 font-sans text-sm pb-10 min-h-screen">

    <div class="max-w-md mx-auto glass-panel rounded-[2rem] shadow-2xl overflow-hidden relative">
        
        <div class="bg-gradient-to-r from-blue-900/50 to-cyan-900/30 p-5 border-b border-cyan-500/20 text-center flex justify-between items-center">
            <div class="text-left">
                <div class="text-[9px] text-cyan-400 uppercase font-black tracking-widest mb-1 opacity-80">Tvůj deník (Odpracováno)</div>
                <div class="text-2xl font-digital font-bold text-white neon-text-blue" id="stat-hodiny">0h 0m</div>
            </div>
            <button onclick="vymazatData()" class="text-[8px] bg-red-900/50 text-red-400 px-3 py-2 rounded-xl border border-red-500/30 uppercase font-bold active:scale-95 transition-all">Vymazat<br>Deník</button>
        </div>

        <div class="p-6 space-y-6">
            
            <div class="bg-slate-800/30 p-5 rounded-2xl border border-slate-700/50">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xs font-black text-cyan-400 uppercase tracking-widest">📓 Zápis do deníku</h2>
                </div>
                
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input type="date" id="datum-prace" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 rounded-xl text-cyan-100 outline-none text-xs">
                    <select id="prodejna" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 rounded-xl text-cyan-100 outline-none text-xs">
                        <option value="">Lokalita...</option>
                        <option value="171 - TŘEBÍČ">171 - Třebíč</option><option value="851 - TŘEBÍČ">851 - Třebíč</option><option value="403 - TŘEBÍČ">403 - Třebíč</option>
                        <option value="025 - BRNO">025 - Brno</option><option value="022 - BRNO">022 - Brno</option><option value="026 - BRNO">026 - Brno</option><option value="125 - ROSICE">125 - Rosice</option>
                        <option value="OKŘÍŠKY">Okříšky</option><option value="354 - J. HRADEC">354 - J. Hradec</option>
                    </select>
                </div>

                <div class="bg-slate-900/50 border border-slate-600/50 p-3 rounded-xl flex justify-between items-center mb-3">
                    <div class="text-[9px] font-bold text-orange-400 uppercase tracking-widest">Práce MIMO paušál (Šéf)</div>
                    <div class="relative inline-block w-10 h-5 align-middle select-none">
                        <input type="checkbox" id="typ-prace" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-slate-700 appearance-none cursor-pointer transition-all duration-300"/>
                        <label for="typ-prace" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-700 cursor-pointer"></label>
                    </div>
                </div>

                <div class="relative mb-2">
                    <textarea id="popis" rows="2" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 pr-10 rounded-xl text-cyan-50 outline-none text-xs" placeholder="Popis práce (nadiktuj)..."></textarea>
                    <button onclick="spustitDiktovani('popis')" class="absolute top-2 right-2 text-lg">🎙️</button>
                </div>

                <div class="relative mb-4">
                    <textarea id="material" rows="2" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 pr-10 rounded-xl text-emerald-100 outline-none text-xs" placeholder="Materiál z účtenky (nadiktuj)..."></textarea>
                    <button onclick="spustitDiktovani('material')" class="absolute top-2 right-2 text-lg">🎙️</button>
                </div>

                <div id="timer-ui" class="bg-[#020617] p-4 rounded-xl text-center border border-cyan-500/30 hidden mb-4">
                    <div id="clock" class="text-4xl font-digital font-black text-white neon-text-blue">00:00:00</div>
                </div>
                
                <button id="btn-start" onclick="startPrace()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-black text-sm uppercase tracking-widest">START STOPKY</button>
                <button id="btn-stop" onclick="stopPrace()" class="hidden w-full bg-red-600 hover:bg-red-500 py-4 rounded-xl font-black text-sm uppercase tracking-widest">UKONČIT & ULOŽIT</button>

                <button onclick="generovatReportSefovi()" class="w-full text-cyan-400 text-[10px] font-bold uppercase mt-4 text-center tracking-widest hover:underline bg-slate-900/50 p-3 rounded-xl border border-cyan-900/50">
                    📋 Zkopírovat report pro Šéfa
                </button>
            </div>

            <div class="bg-amber-900/20 border border-amber-500/30 p-5 rounded-2xl relative">
                <h2 class="text-xs font-black text-amber-500 uppercase tracking-widest mb-4">🖨️ Zápis do originálního PDF</h2>
                
                <div class="mb-4 bg-slate-900/80 border border-amber-500/30 p-3 rounded-xl">
                    <label class="block text-[9px] font-bold text-amber-300 uppercase tracking-widest mb-2">1. Nahraj čistý vzor TSC PDF</label>
                    <input type="file" id="pdf-template" accept="application/pdf" class="w-full text-xs text-slate-300 outline-none">
                </div>

                <div class="space-y-4">
                    <select id="ai-prodejna" class="w-full bg-slate-900 border border-amber-500/50 p-3 rounded-xl text-amber-100 outline-none text-xs font-bold">
                        <option value="171 - TŘEBÍČ">171 - Třebíč (Pátky | 19h)</option>
                        <option value="851 - TŘEBÍČ">851 - Třebíč (Úterky | 32h)</option>
                        <option value="403 - TŘEBÍČ">403 - Třebíč (Čtvrtky | 19h)</option>
                        <option value="025 - BRNO">025 - Brno (Předposlední st | 3h)</option>
                        <option value="022 - BRNO">022 - Brno (Středy | 14h)</option>
                        <option value="026 - BRNO">026 - Brno (Středy | 14h)</option>
                        <option value="125 - ROSICE">125 - Rosice (Středy | 14h)</option>
                        <option value="OKŘÍŠKY">Okříšky (Předposlední čt | 3h)</option>
                    </select>

                    <input type="text" id="ai-cislo-an" placeholder="Zadej aktuální BÚ / Číslo AN" class="w-full bg-slate-900 border border-amber-500/50 p-3 rounded-xl text-amber-100 outline-none text-xs font-bold">
                    
                    <button id="btn-vygenerovat" onclick="vygenerujAlbertPDF()" class="w-full bg-amber-600 hover:bg-amber-500 py-4 rounded-xl font-bold uppercase tracking-widest text-xs transition-all active:scale-95">
                        ⚙️ Zapsat a stáhnout PDF
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let startTime = null; let timerInterval = null;
        
        const ALBERT_CILY = {
            "171 - TŘEBÍČ": { udrzba: 15, tech: 4, den: 5 }, "851 - TŘEBÍČ": { udrzba: 16, tech: 16, den: 2 }, "403 - TŘEBÍČ": { udrzba: 12, tech: 7, den: 4 }, 
            "022 - BRNO": { udrzba: 8, tech: 6, den: 3 }, "026 - BRNO": { udrzba: 8, tech: 6, den: 3 }, "125 - ROSICE": { udrzba: 8, tech: 6, den: 3 }, 
            "025 - BRNO": { udrzba: 2, tech: 1, den: 3, secondLast: true }, "OKŘÍŠKY": { udrzba: 2, tech: 1, den: 4, secondLast: true } 
        };
        
        // 🚀 HUTNÁ DATABÁZE VÝRAZŮ (AI to poskládá do dlouhých odstavců)
        const P1 = ["Oprava dilatačních spár", "Seřízení a promazání pantů dveří", "Čištění odpadů v zázemí", "Oprava a údržba regálů", "Výměna prasklé dlažby", "Montáž nových polic", "Zapravování omítky"];
        const P2 = ["kontrola a výměna osvětlení", "drobné instalatérské opravy", "oprava rohů zdiva", "dotažení ochranných lišt", "oprava šatních skříněk", "výměna poškozených madel", "seřízení zavíračů dveří"];
        const P3 = ["celkový úklid po opravě", "zápis do knihy závad", "likvidace starého materiálu", "odzkoušení funkčnosti"];
        const MATS = ["Spoj. materiál", "Silikon", "Tmel", "Lepidlo", "Mazivo", "Sprej", "LED zdroj", "Těsnění", "Kování"];

        window.onload = () => {
            document.getElementById('datum-prace').value = new Date().toISOString().split('T')[0];
            vypocitejStatistiky();
            if (localStorage.getItem('active_timer')) { startTime = new Date(localStorage.getItem('active_timer')); rezimBehu(); }
        };

        function vymazatData() { if(confirm("Opravdu smazat deník?")) { localStorage.removeItem('kamil_denik_db'); location.reload(); } }
        function vypocitejStatistiky() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            const m = new Date().toISOString().slice(0, 7); let p = 0;
            db.forEach(z => { if(z.datum.startsWith(m)) p += z.trvani; });
            document.getElementById('stat-hodiny').innerText = `${Math.floor(p/60)}h ${p%60}m`;
        }
        function startPrace() { startTime = new Date(); localStorage.setItem('active_timer', startTime.toISOString()); rezimBehu(); }
        function rezimBehu() {
            document.getElementById('btn-start').classList.add('hidden'); document.getElementById('btn-stop').classList.remove('hidden'); document.getElementById('timer-ui').classList.remove('hidden');
            timerInterval = setInterval(() => { document.getElementById('clock').innerText = new Date(new Date() - startTime).toISOString().substr(11, 8); }, 1000);
        }
        function stopPrace() {
            const pr = document.getElementById('prodejna').value; if(!pr) return alert("Vyber nejdřív lokalitu!");
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            db.push({ datum: document.getElementById('datum-prace').value, prodejna: pr, popis: document.getElementById('popis').value, material: document.getElementById('material').value, trvani: Math.round((new Date() - startTime) / 60000) });
            localStorage.setItem('kamil_denik_db', JSON.stringify(db)); location.reload();
        }
        function generovatReportSefovi() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]"); 
            if (db.length === 0) return alert("Deník je zatím prázdný!");
            let t = "Měsíční report:\n\n"; let celkem = 0;
            db.forEach(z => { t += `- ${z.datum} | ${z.prodejna}: ${(z.trvani/60).toFixed(1)}h (${z.popis})\n`; celkem += z.trvani; });
            t += `\nCelkem: ${(celkem/60).toFixed(1)}h`;
            navigator.clipboard.writeText(t).then(() => alert("✅ Report zkopírován!"));
        }

        // Inteligentní kráječ hodin (Rozděluje jen po 0.5h, 1.0h, 1.5h - žádné zlomky)
        function rozdelHodiny(celkem, pocet) {
            let v = new Array(pocet).fill(0);
            if (pocet === 0 || celkem <= 0) return v;
            celkem = Math.round(celkem * 2) / 2; 
            let zbytek = celkem;
            let prumer = Math.floor((celkem / pocet) * 2) / 2; 
            for(let i=0; i<pocet; i++) { v[i] = prumer; zbytek -= prumer; }
            let idx = 0;
            while(zbytek >= 0.5 && zbytek < 100) { v[idx] += 0.5; zbytek -= 0.5; idx = (idx + 1) % pocet; }
            return v;
        }

        async function vygenerujAlbertPDF() {
            const fileInput = document.getElementById('pdf-template');
            const btn = document.getElementById('btn-vygenerovat');
            if (!fileInput.files.length) return alert("⚠️ Nejdřív nahraj vzor od TSC!");

            const pId = document.getElementById('ai-prodejna').value;
            const an = document.getElementById('ai-cislo-an').value;
            if(!an) return alert("Zadej Číslo AN pro tento výkaz!");

            btn.innerText = "⏳ Vytvářím PDF...";

            try {
                const file = fileInput.files[0];
                const arrayBuffer = await new Promise((resolve, reject) => {
                    const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error("Nelze přečíst PDF.")); reader.readAsArrayBuffer(file);
                });

                const { PDFDocument, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                pdfDoc.registerFontkit(window.fontkit);
                const page = pdfDoc.getPages()[0]; 

                const fontUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.66/fonts/Roboto/Roboto-Regular.ttf';
                const fontBytes = await fetch(fontUrl).then(res => res.arrayBuffer());
                const customFont = await pdfDoc.embedFont(fontBytes);

                const limit = { ...ALBERT_CILY[pId] };
                const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
                const d = new Date(); const rok = d.getFullYear(); const mes = d.getMonth() + 1;
                const prefix = `${rok}-${String(mes).padStart(2, '0')}`;
                const pocetDni = new Date(rok, mes, 0).getDate();
                
                let dnyVhodne = [];
                for (let i = 1; i <= pocetDni; i++) { if (new Date(rok, mes-1, i).getDay() === limit.den) dnyVhodne.push(i); }
                if (limit.secondLast && dnyVhodne.length >= 2) dnyVhodne = [dnyVhodne[dnyVhodne.length - 2]];

                // Odečtení tvé RUČNĚ zaznamenané práce z deníku (včetně účtenek)
                let rucniHodiny = 0;
                let dny = {};
                
                db.filter(z => z.prodejna === pId && z.datum.startsWith(prefix)).forEach(z => {
                    let den = parseInt(z.datum.split('-')[2]);
                    if(!dny[den]) dny[den] = { u: 0, t: 0, p: [], m: [] };
                    
                    let udrzbaHod = Math.round((z.trvani / 60) * 2) / 2; // Zaokrouhleno
                    dny[den].u += udrzbaHod;
                    if(z.popis) dny[den].p.push("- " + z.popis);
                    if(z.material) dny[den].m.push("- " + z.material);
                    
                    limit.udrzba -= udrzbaHod;
                });
                if(limit.udrzba < 0) limit.udrzba = 0;

                // Rozdělení zbytku AI hodin
                let rozvrhU = rozdelHodiny(limit.udrzba, dnyVhodne.length);
                let rozvrhT = rozdelHodiny(limit.tech, dnyVhodne.length);

                dnyVhodne.forEach((den, index) => {
                    if(!dny[den]) dny[den] = { u: 0, t: 0, p: [], m: [] };
                    dny[den].u += rozvrhU[index];
                    dny[den].t += rozvrhT[index];
                    
                    if(rozvrhU[index] > 0) { 
                        // AI Generátor masivního textu (Spustí se jen tam, kde se přidávají umělé hodiny)
                        let hutnyPopis = "- " + P1[Math.floor(Math.random()*P1.length)] + ",\n  " + P2[Math.floor(Math.random()*P2.length)] + ",\n  " + P3[Math.floor(Math.random()*P3.length)] + ".";
                        dny[den].p.push(hutnyPopis); 
                        
                        let mat1 = MATS[Math.floor(Math.random()*MATS.length)];
                        let mat2 = MATS[Math.floor(Math.random()*MATS.length)];
                        let hutnyMat = mat1 === mat2 ? "- " + mat1 : "- " + mat1 + ",\n- " + mat2;
                        dny[den].m.push(hutnyMat); 
                    }
                });

                const cerna = rgb(0, 0, 0);
                page.drawText(pId.split('-')[0].trim(), { x: 140, y: 652, size: 10, font: customFont, color: cerna });
                page.drawText(`${mes} / ${rok}`, { x: 420, y: 652, size: 10, font: customFont, color: cerna });

                let startY = 515;  
                let radekMezera = 58; 
                let i = 0;
                
                Object.keys(dny).sort((a,b)=>a-b).forEach(den => {
                    let r = dny[den];
                    let baseY = startY - (i * radekMezera);
                    
                    page.drawText(an, { x: 42, y: baseY + 15, size: 9, font: customFont, color: cerna });
                    page.drawText(`${den}.${mes}.`, { x: 42, y: baseY, size: 11, font: customFont, color: cerna });

                    let jeOdecet = (den > 14 && den < 22) ? "\n+ odečty energií" : "";
                    
                    // Kreslení Technologie (Nahoře)
                    if (r.t > 0) {
                        let textTech = "Kontrola teh.";
                        if (pId.includes("851") || pId.includes("403")) textTech += "\nkon. nev. vyhr. tech. zař.";
                        textTech += jeOdecet;

                        page.drawText(textTech, { x: 185, y: baseY + 15, size: 9, font: customFont, color: cerna, lineHeight: 10 });
                        page.drawText(`${r.t.toFixed(1).replace('.',',')}h`, { x: 515, y: baseY + 15, size: 11, font: customFont, color: cerna });
                    }

                    // Kreslení Údržby s automatickým ZALAMOVÁNÍM textu (Dole)
                    if (r.u > 0) {
                        let udrzbaY = (r.t > 0) ? baseY - 12 : baseY + 15; // Posun dolů, pokud je nad tím technologie
                        
                        // Uděláme tenkou přerušovanou čáru mezi technologií a údržbou
                        if (r.t > 0) {
                            page.drawLine({ start: { x: 185, y: baseY - 2 }, end: { x: 540, y: baseY - 2 }, thickness: 0.5, color: cerna, dashArray: [2, 2] });
                        }

                        let textPopisu = r.p.join('\n');
                        let textMat = r.m.join('\n');

                        page.drawText(textPopisu, { x: 185, y: udrzbaY, size: 8, font: customFont, color: cerna, maxWidth: 195, lineHeight: 10 });
                        page.drawText(textMat, { x: 395, y: udrzbaY, size: 8, font: customFont, color: cerna, maxWidth: 100, lineHeight: 10 });
                        page.drawText(`${r.u.toFixed(1).replace('.',',')}h`, { x: 515, y: udrzbaY, size: 11, font: customFont, color: cerna });
                    }
                    i++;
                });

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `Vykaz_Albert_${pId.split('-')[0].trim()}.pdf`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);

                btn.innerText = "✅ Staženo! (Koukni do Souborů)";
                setTimeout(() => { btn.innerText = "⚙️ Zapsat a stáhnout PDF"; }, 4000);

            } catch (error) {
                console.error(error); alert(`🔴 CHYBA: ${error.message}\n\nZkus si obnovit stránku.`); btn.innerText = "⚙️ Zkusit znovu";
            }
        }
    </script>
</body>
</html>
