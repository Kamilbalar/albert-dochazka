<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamil Facility ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { font-family: 'Inter', sans-serif; background: #020617; color: #e2e8f0; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .mic-active { animation: pulse-red 1.5s infinite; background: #ef4444 !important; color: white !important; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .btn-top { @apply bg-gradient-to-r from-sky-600 to-blue-700 py-4 rounded-3xl font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all; }
    </style>
</head>
<body class="p-4 pb-32">

    <div class="max-w-md mx-auto space-y-6">
        
        <div class="glass rounded-[2.5rem] p-6 shadow-2xl flex justify-between items-center border-b-4 border-sky-500">
            <div>
                <h1 class="text-[9px] font-black tracking-widest uppercase opacity-40 mb-1">Měsíční Odpracováno</h1>
                <div class="text-3xl font-digital font-bold text-sky-400" id="stat-hodiny">0h 0m</div>
            </div>
            <button onclick="vymazatData()" class="bg-rose-500/20 text-rose-400 text-[10px] px-4 py-2 rounded-full border border-rose-500/30 font-bold uppercase">Reset</button>
        </div>

        <div class="glass rounded-[2.5rem] p-6 space-y-5">
            <h2 class="text-xs font-black uppercase tracking-widest text-sky-500 flex items-center gap-2">
                <span class="w-2 h-2 bg-sky-500 rounded-full animate-ping"></span>
                Zápis do deníku / Účtenky
            </h2>

            <div class="grid grid-cols-2 gap-3">
                <input type="date" id="datum-prace" class="bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs outline-none focus:border-sky-500 transition-all">
                <div class="relative">
                    <select id="prodejna" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs outline-none focus:border-sky-500 appearance-none font-bold">
                        <option value="171 - TŘEBÍČ">171 - Třebíč</option>
                        <option value="851 - TŘEBÍČ">851 - Třebíč</option>
                        <option value="403 - TŘEBÍČ">403 - Třebíč</option>
                        <option value="025 - BRNO">025 - Brno</option>
                        <option value="OKŘÍŠKY">Okříšky</option>
                    </select>
                    <button onclick="najdiGPS()" class="absolute right-3 top-3 text-lg opacity-60">📍</button>
                </div>
            </div>

            <div class="relative">
                <textarea id="popis" rows="3" class="w-full bg-slate-900 border border-slate-700 p-5 pr-14 rounded-[2rem] text-sm outline-none focus:border-sky-500" placeholder="Co jsi dělal? (Mluv klidně dlouho...)"></textarea>
                <button id="mic-popis" onclick="toggleMic('popis')" class="absolute right-3 top-3 w-10 h-10 bg-slate-800 rounded-2xl flex items-center justify-center text-xl transition-all">🎙️</button>
            </div>

            <div class="relative">
                <input id="material" type="text" class="w-full bg-slate-900 border border-slate-700 p-5 pr-14 rounded-2xl text-sm outline-none focus:border-sky-500" placeholder="Materiál z účtenek...">
                <button id="mic-mat" onclick="toggleMic('material')" class="absolute right-3 top-2.5 w-10 h-10 bg-slate-800 rounded-2xl flex items-center justify-center text-xl transition-all">🎙️</button>
            </div>

            <button onclick="ulozZaznam()" class="btn-top w-full">Uložit záznam dne</button>
            
            <div id="seznam-zaznamu" class="space-y-3 max-h-48 overflow-y-auto pt-2"></div>
        </div>

        <div class="glass rounded-[2.5rem] p-6 bg-amber-500/5 border-amber-500/20 space-y-4">
            <h2 class="text-xs font-black text-amber-500 uppercase tracking-widest">🖨️ Albert PDF Automat</h2>
            
            <div class="space-y-3">
                <input type="text" id="ai-cislo-an" placeholder="Aktuální číslo AN (např. AP2608544)" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs font-bold text-amber-100 outline-none">
                
                <div class="bg-black/30 p-4 rounded-2xl border border-white/5 space-y-3">
                    <p class="text-[9px] font-bold text-slate-500 uppercase text-center">🛠️ Kalibrace do modrých linek</p>
                    <div class="flex items-center justify-between px-4">
                        <button onclick="posun(-2)" class="w-10 h-10 glass rounded-full text-xl flex items-center justify-center">-</button>
                        <div class="text-center">
                            <span class="text-[8px] opacity-40 block mb-1 uppercase">Výška textu (Y)</span>
                            <span id="val-y" class="font-digital text-sky-400">512</span>
                        </div>
                        <button onclick="posun(2)" class="w-10 h-10 glass rounded-full text-xl flex items-center justify-center">+</button>
                    </div>
                </div>

                <button id="btn-vygenerovat" onclick="vygenerujAlbertPDF()" class="w-full bg-amber-600 hover:bg-amber-500 py-5 rounded-[2rem] font-black text-sm uppercase tracking-widest active:scale-95 transition-all shadow-2xl">
                    Sestavit a stáhnout PDF
                </button>
                <input type="file" id="pdf-template" class="hidden" onchange="ulozitVzor(event)">
                <p id="vzor-status" class="text-[9px] text-center opacity-30 cursor-pointer" onclick="document.getElementById('pdf-template').click()">Klikni pro aktualizaci PDF vzoru</p>
            </div>
        </div>
    </div>

    <script>
        let recognition = null;
        let isListening = false;
        let currentY = parseInt(localStorage.getItem('cal_y')) || 512;

        window.onload = () => {
            document.getElementById('datum-prace').value = new Date().toISOString().split('T')[0];
            document.getElementById('val-y').innerText = currentY;
            vypocitejStatistiky(); vykresliDenik();
        };

        // --- 🎙️ NEKONEČNÉ DIKTOVÁNÍ (CONTINUOUS Speech AI) ---
        function toggleMic(id) {
            if (isListening) { recognition.stop(); return; }
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'cs-CZ';
            recognition.continuous = true; // <--- Klíčová vlastnost pro nekonečné mluvení
            recognition.interimResults = false;

            recognition.onstart = () => { isListening = true; document.getElementById('mic-'+(id==='popis'?'popis':'mat')).classList.add('mic-active'); };
            recognition.onresult = (e) => { const txt = e.results[e.results.length - 1][0].transcript; document.getElementById(id).value += (document.getElementById(id).value ? ' ' : '') + txt; };
            recognition.onend = () => { isListening = false; document.querySelectorAll('button[id^="mic"]').forEach(b => b.classList.remove('mic-active')); };
            recognition.start();
        }

        function posun(v) { currentY += v; document.getElementById('val-y').innerText = currentY; localStorage.setItem('cal_y', currentY); }

        function ulozZaznam() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            db.push({ datum: document.getElementById('datum-prace').value, prodejna: document.getElementById('prodejna').value, popis: document.getElementById('popis').value, material: document.getElementById('material').value, trvani: 60 });
            localStorage.setItem('kamil_denik_db', JSON.stringify(db));
            document.getElementById('popis').value = ''; document.getElementById('material').value = '';
            vypocitejStatistiky(); vykresliDenik();
        }

        function vykresliDenik() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            document.getElementById('seznam-zaznamu').innerHTML = db.slice(-5).reverse().map((z, i) => `
                <div class="glass p-4 rounded-3xl border border-white/5 flex justify-between items-center shadow-lg">
                    <div class="text-[10px]">
                        <span class="text-sky-400 font-black">${z.datum.split('-').reverse().join('.')}</span><br>
                        <span class="opacity-70">${z.prodejna.split(' ')[0]} - ${z.popis.substring(0,25)}...</span>
                    </div>
                    <button onclick="smazatZaznam(${db.length-1-i})" class="text-rose-500 text-xs p-2">✕</button>
                </div>
            `).join('');
        }

        function smazatZaznam(i) { const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]"); db.splice(i, 1); localStorage.setItem('kamil_denik_db', JSON.stringify(db)); vypocitejStatistiky(); vykresliDenik(); }
        function vymazatData() { if(confirm("Opravdu smazat měsíc?")) { localStorage.removeItem('kamil_denik_db'); location.reload(); } }
        function vypocitejStatistiky() { const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]"); let m = 0; db.forEach(z => m += z.trvani); document.getElementById('stat-hodiny').innerText = `${Math.floor(m/60)}h ${m%60}m`; document.getElementById('stat-penize').innerText = (Math.floor(m/60) * 350).toLocaleString() + " Kč"; }
        function ulozitVzor(e) { const reader = new FileReader(); reader.onload = (evt) => { localStorage.setItem('tsc_vzor_pdf', evt.target.result); alert("Vzor uložen!"); }; reader.readAsDataURL(e.target.files[0]); }

        async function vygenerujAlbertPDF() {
            const base64 = localStorage.getItem('tsc_vzor_pdf'); if(!base64) return alert("Prvně nahraj čisté PDF dole!");
            const an = document.getElementById('ai-cislo-an').value; if(!an) return alert("Zadej AN!");
            const btn = document.getElementById('btn-vygenerovat'); btn.innerText = "⏳ Vytvářím Mistrovské PDF...";

            try {
                const arrayBuffer = await fetch(base64).then(res => res.arrayBuffer());
                const { PDFDocument, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                pdfDoc.registerFontkit(window.fontkit);
                const page = pdfDoc.getPages()[0];
                const fontBytes = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.66/fonts/Roboto/Roboto-Bold.ttf').then(res => res.arrayBuffer());
                const font = await pdfDoc.embedFont(fontBytes);

                const prodejna = document.getElementById('prodejna').value;
                const mesic = new Date().getMonth() + 1;
                
                // --- PIXEL-PERFECT TISK DO LINEK ---
                page.drawText(prodejna.split('-')[0].trim(), { x: 155, y: 648, size: 11, font: font });
                page.drawText(`${mesic} / 2026`, { x: 425, y: 648, size: 11, font: font });

                const dny = [7, 14, 21, 28]; // Příklad rozvrhu
                dny.forEach((den, i) => {
                    let y = currentY - (i * 68);
                    
                    // Sloupec 1: AN a Datum
                    page.drawText(an, { x: 45, y: y, size: 10, font: font });
                    page.drawText(`${den}.${mesic}.`, { x: 45, y: y - 14, size: 12, font: font });

                    // Sloupec 3: PRÁCE (Bohatý styl)
                    page.drawText("kontrola teh.", { x: 188, y: y, size: 11, font: font });
                    let y2 = y - 14;
                    if(prodejna.includes("851") || prodejna.includes("403")) { page.drawText("kon. nev. vyhr. tech. zař.", { x: 188, y: y2, size: 10, font: font }); y2 -= 13; }
                    if(i === 2) { page.drawText("odečty energií", { x: 188, y: y2, size: 11, font: font }); y2 -= 13; }
                    
                    const JOBS = ["oprava obkladů a zapravení", "proplach a čištění odpadů", "seřízení dveří a pantů", "oprava regálů v prodejně"];
                    page.drawText(JOBS[i], { x: 188, y: y2, size: 11, font: font });
                    
                    // Sloupec 4: MATERIÁL
                    page.drawText("spoj. mat, silikon", { x: 395, y: y2, size: 10, font: font });

                    // Sloupec 5: HODINY
                    page.drawText("1,5h", { x: 518, y: y, size: 12, font: font });
                    page.drawText("2,0h", { x: 518, y: y2, size: 12, font: font });
                });

                const pdfBytes = await pdfDoc.save();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
                link.download = `Vykaz_Albert_ULTIMATE.pdf`;
                link.click();
                btn.innerText = "✅ Hotovo!"; setTimeout(() => btn.innerText = "Sestavit a stáhnout PDF", 3000);
            } catch (e) { alert(e.message); btn.innerText = "Chyba!"; }
        }
    </script>
</body>
</html>
