<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamil Facility ULTIMATE FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { font-family: 'Inter', sans-serif; background: #020617; color: #e2e8f0; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="p-4 pb-32">

    <div class="max-w-md mx-auto space-y-6">
        
        <div class="glass rounded-[2.5rem] p-6 shadow-2xl flex justify-between items-center border-b-4 border-sky-500">
            <div>
                <h1 class="text-[9px] font-black tracking-widest uppercase opacity-40 mb-1">Měsíční Status</h1>
                <div class="text-3xl font-digital font-bold text-sky-400" id="stat-hodiny">0h 0m</div>
            </div>
            <button onclick="localStorage.removeItem('kamil_denik_db'); location.reload();" class="bg-rose-500/20 text-rose-400 text-[10px] px-4 py-2 rounded-full border border-rose-500/30 font-bold uppercase">Reset</button>
        </div>

        <div class="glass rounded-[2.5rem] p-6 space-y-5">
            <h2 class="text-xs font-black uppercase tracking-widest text-sky-500 flex items-center gap-2">📓 Tvůj deník</h2>
            <div class="grid grid-cols-2 gap-3">
                <input type="date" id="datum-prace" class="bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs outline-none focus:border-sky-500">
                <select id="prodejna" class="bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs outline-none focus:border-sky-500 font-bold">
                    <option value="171 - TŘEBÍČ">171 - Třebíč</option>
                    <option value="851 - TŘEBÍČ">851 - Třebíč</option>
                    <option value="403 - TŘEBÍČ">403 - Třebíč</option>
                    <option value="025 - BRNO">025 - Brno</option>
                </select>
            </div>
            <textarea id="popis" rows="2" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-sm outline-none focus:border-sky-500" placeholder="Popis práce..."></textarea>
            <input id="material" type="text" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-sm outline-none focus:border-sky-500" placeholder="Materiál z účtenky...">
            <button onclick="ulozZaznam()" class="w-full bg-gradient-to-r from-sky-600 to-blue-700 py-4 rounded-3xl font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all">Uložit den</button>
            <div id="seznam-zaznamu" class="space-y-2 max-h-40 overflow-y-auto"></div>
        </div>

        <div class="glass rounded-[2.5rem] p-6 bg-amber-500/5 border-amber-500/10 space-y-4">
            <h2 class="text-xs font-black text-amber-500 uppercase tracking-widest">🖨️ Albert PDF Automat</h2>
            
            <input type="file" id="pdf-template" accept="application/pdf" class="hidden" onchange="ulozitVzor(event)">
            <label for="pdf-template" id="vzor-label" class="cursor-pointer block text-center p-3 border border-dashed border-amber-500/30 rounded-xl text-[10px] text-amber-500 uppercase">Nahraj vzor PDF</label>

            <input type="text" id="ai-cislo-an" placeholder="Číslo AH (např. Ap2647383)" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs font-bold text-amber-100 outline-none">
            
            <div class="bg-black/30 p-4 rounded-3xl border border-white/5 space-y-4">
                <p class="text-[9px] font-bold text-slate-500 uppercase text-center">Ladění trefy do linek (Y / X)</p>
                <div class="grid grid-cols-2 gap-4">
                    <div class="text-center">
                        <span class="text-[8px] opacity-40 block mb-1 uppercase">Výška (Y)</span>
                        <div class="flex items-center justify-between bg-slate-900 rounded-xl p-1">
                            <button onclick="adjust('cal_y', -2)" class="p-2 text-sky-400">-</button>
                            <span id="val-y" class="font-digital text-xs">525</span>
                            <button onclick="adjust('cal_y', 2)" class="p-2 text-sky-400">+</button>
                        </div>
                    </div>
                    <div class="text-center">
                        <span class="text-[8px] opacity-40 block mb-1 uppercase">Zleva (X)</span>
                        <div class="flex items-center justify-between bg-slate-900 rounded-xl p-1">
                            <button onclick="adjust('cal_x', -2)" class="p-2 text-sky-400">-</button>
                            <span id="val-x" class="font-digital text-xs">190</span>
                            <button onclick="adjust('cal_x', 2)" class="p-2 text-sky-400">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="vygenerujAlbertPDF()" class="w-full bg-amber-600 hover:bg-amber-500 py-5 rounded-[2rem] font-black text-sm uppercase tracking-widest active:scale-95 transition-all shadow-2xl">
                Sestavit a stáhnout PDF
            </button>
        </div>
    </div>

    <script>
        window.onload = () => {
            document.getElementById('datum-prace').value = new Date().toISOString().split('T')[0];
            vypocitejStatistiky(); vykresliDenik();
            document.getElementById('val-y').innerText = localStorage.getItem('cal_y') || 525;
            document.getElementById('val-x').innerText = localStorage.getItem('cal_x') || 190;
            if (localStorage.getItem('tsc_vzor_pdf')) document.getElementById('vzor-label').innerText = "VZOR PDF PŘIPRAVEN ✅";
        };

        function adjust(key, val) {
            let n = parseInt(localStorage.getItem(key) || (key === 'cal_y' ? 525 : 190)) + val;
            localStorage.setItem(key, n);
            document.getElementById(key === 'cal_y' ? 'val-y' : 'val-x').innerText = n;
        }

        function ulozZaznam() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            db.push({ datum: document.getElementById('datum-prace').value, prodejna: document.getElementById('prodejna').value, popis: document.getElementById('popis').value, material: document.getElementById('material').value, trvani: 60 });
            localStorage.setItem('kamil_denik_db', JSON.stringify(db)); location.reload();
        }

        function vykresliDenik() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            document.getElementById('seznam-zaznamu').innerHTML = db.slice(-3).reverse().map(z => `<div class="glass p-3 rounded-2xl text-[10px] opacity-70 border-l-4 border-sky-500">${z.datum} | ${z.prodejna}<br>${z.popis}</div>`).join('');
        }

        function vypocitejStatistiky() { const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]"); let m = 0; db.forEach(z => m += z.trvani); document.getElementById('stat-hodiny').innerText = `${Math.floor(m/60)}h ${m%60}m`; }
        function ulozitVzor(e) { const reader = new FileReader(); reader.onload = (evt) => { localStorage.setItem('tsc_vzor_pdf', evt.target.result); location.reload(); }; reader.readAsDataURL(e.target.files[0]); }

        async function vygenerujAlbertPDF() {
            const base64 = localStorage.getItem('tsc_vzor_pdf'); if(!base64) return alert("Nahraj vzor!");
            const an = document.getElementById('ai-cislo-an').value; if(!an) return alert("Zadej AN!");
            
            try {
                const arrayBuffer = await fetch(base64).then(res => res.arrayBuffer());
                const { PDFDocument, StandardFonts, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
                const page = pdfDoc.getPages()[0];
                const prodejna = document.getElementById('prodejna').value;
                const mesic = new Date().getMonth() + 1;

                const cy = parseInt(localStorage.getItem('cal_y') || 525);
                const cx = parseInt(localStorage.getItem('cal_x') || 190);

                // HLAVIČKA NA MÍRU 
                page.drawText(prodejna.split('-')[0].trim(), { x: 235, y: 668, size: 12, font: font });
                page.drawText(`${mesic} / 2026`, { x: 670, y: 668, size: 12, font: font });

                const PRACE = [
                    { p: "oprava obkladu a dlazby\ncisteni odpadu v zazemi\nserizeni pantu dveri", m: "lepidlo, silikon\ntesneni, sprej" },
                    { p: "oprava poskozenych regalu\ndotazeni ochrannych list\nkontrola osvetleni", m: "vruty, hmozdinky\ntmel, srouby" },
                    { p: "vymena sanitarni techniky\noprava satnich skrinek\nzapravovani der v omitce", m: "1x baterie, silikon\npanty, kovani" },
                    { p: "oprava zamku dveri\ndoplneni spoj. materialu\ncisteni podlahove vpusti", m: "zamek, kovani\nspoj. mat" }
                ];

                const dny = [7, 14, 21, 28];
                dny.forEach((den, i) => {
                    let y = cy - (i * 102); // 👈 MASIVNÍ ROZESTUP PRO MODRÉ BUŇKY 
                    
                    const safe = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

                    page.drawText(an, { x: 80, y: y, size: 10, font: font });
                    page.drawText(`${den}.${mesic}.`, { x: 80, y: y - 18, size: 12, font: font });

                    page.drawText("kontrola teh.", { x: cx, y: y, size: 11, font: font });
                    page.drawText("1.0h", { x: 855, y: y, size: 12, font: font });

                    let y2 = y - 18;
                    if(i === 2) { page.drawText("odecty energii", { x: cx, y: y2, size: 11, font: font }); y2 -= 18; }
                    
                    const item = PRACE[i];
                    page.drawText(safe(item.p), { x: cx, y: y2, size: 10, font: font, lineHeight: 14 });
                    page.drawText(safe(item.m), { x: 610, y: y2, size: 10, font: font, lineHeight: 14 });
                    page.drawText("3.0h", { x: 855, y: y2, size: 12, font: font });
                });

                const pdfBytes = await pdfDoc.save();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
                link.download = `Vykaz_${prodejna.split(' ')[0]}.pdf`;
                link.click();
            } catch (e) { alert(e.message); }
        }
    </script>
</body>
</html>
