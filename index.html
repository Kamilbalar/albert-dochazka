<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albert Facility PRO - Kamil Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-text-blue { text-shadow: 0 0 10px rgba(56, 189, 248, 0.8); }
    </style>
</head>
<body class="bg-[#050b14] text-slate-100 p-4 font-sans text-sm pb-10 min-h-screen">

    <div class="max-w-md mx-auto glass-panel rounded-[2rem] shadow-2xl overflow-hidden relative">
        
        <div class="bg-gradient-to-r from-blue-900/50 to-cyan-900/30 p-5 border-b border-cyan-500/20 text-center flex justify-between items-center">
            <div class="text-left">
                <div class="text-[9px] text-cyan-400 uppercase font-black tracking-widest mb-1 opacity-80">Tvůj deník (Odpracováno)</div>
                <div class="text-2xl font-digital font-bold text-white neon-text-blue" id="stat-hodiny">0h 0m</div>
            </div>
            <button onclick="vymazatData()" class="text-[8px] bg-red-900/50 text-red-400 px-3 py-2 rounded-xl border border-red-500/30 uppercase font-bold active:scale-95 transition-all">Vymazat<br>Deník</button>
        </div>

        <div class="p-6 space-y-6">
            
            <div class="bg-slate-800/30 p-5 rounded-2xl border border-slate-700/50">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xs font-black text-cyan-400 uppercase tracking-widest">📓 Zápis do deníku</h2>
                    <span id="gps-status" class="text-[9px] font-bold text-emerald-400 hidden animate-pulse">📍 GPS ZAMĚŘENO</span>
                </div>
                
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input type="date" id="datum-prace" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 rounded-xl text-cyan-100 outline-none text-xs">
                    
                    <div class="relative w-full">
                        <select id="prodejna" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 pr-10 rounded-xl text-cyan-100 outline-none text-xs appearance-none">
                            <option value="">Vyber barák...</option>
                            <optgroup label="Třebíč a okolí">
                                <option value="171 - TŘEBÍČ">171 - Třebíč</option><option value="851 - TŘEBÍČ">851 - Třebíč</option><option value="403 - TŘEBÍČ">403 - Třebíč</option><option value="OKŘÍŠKY">Okříšky</option>
                            </optgroup>
                            <optgroup label="Brno a okolí">
                                <option value="025 - BRNO">025 - Brno</option><option value="022 - BRNO">022 - Brno</option><option value="026 - BRNO">026 - Brno</option><option value="125 - ROSICE">125 - Rosice</option>
                            </optgroup>
                            <optgroup label="Jiné">
                                <option value="354 - J. HRADEC">354 - J. Hradec</option><option value="Jiné / Cesta">Jiné / Cesta</option>
                            </optgroup>
                        </select>
                        <button onclick="najdiMojiPolohu()" class="absolute right-2 top-2 text-lg hover:scale-110 transition-all" title="Zaměřit polohu">📍</button>
                    </div>
                </div>

                <div class="relative mb-4">
                    <textarea id="popis" rows="2" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 pr-10 rounded-xl text-cyan-50 outline-none text-xs" placeholder="Krátká poznámka k práci..."></textarea>
                    <button onclick="spustitDiktovani('popis')" class="absolute top-2 right-2 text-lg">🎙️</button>
                </div>

                <div id="timer-ui" class="bg-[#020617] p-4 rounded-xl text-center border border-cyan-500/30 hidden mb-4">
                    <div id="clock" class="text-4xl font-digital font-black text-white neon-text-blue">00:00:00</div>
                </div>
                
                <button id="btn-start" onclick="startPrace()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-black text-sm uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-emerald-900/20">START STOPKY</button>
                <button id="btn-stop" onclick="stopPrace()" class="hidden w-full bg-red-600 hover:bg-red-500 py-4 rounded-xl font-black text-sm uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-red-900/20">UKONČIT & ULOŽIT</button>

                <button onclick="generovatReportSefovi()" class="w-full text-cyan-400 text-[10px] font-bold uppercase mt-4 text-center tracking-widest hover:underline bg-slate-900/50 p-3 rounded-xl border border-cyan-900/50 active:scale-95">
                    📋 Zkopírovat report pro Šéfa
                </button>
            </div>

            <div class="bg-amber-900/20 border border-amber-500/30 p-5 rounded-2xl relative">
                <h2 class="text-xs font-black text-amber-500 uppercase tracking-widest mb-4">🖨️ Automat: Výkazy pro Albert</h2>
                
                <div class="mb-4 bg-slate-900/80 border border-amber-500/30 p-3 rounded-xl">
                    <label class="block text-[9px] font-bold text-amber-300 uppercase tracking-widest mb-2">1. Vyber prázdný PDF vzor od TSC</label>
                    <input type="file" id="pdf-template" accept="application/pdf" class="w-full text-xs text-slate-300 outline-none">
                </div>

                <div class="space-y-4">
                    <select id="ai-prodejna" class="w-full bg-slate-900 border border-amber-500/50 p-3 rounded-xl text-amber-100 outline-none text-xs font-bold">
                        <option value="171 - TŘEBÍČ">171 - Třebíč (Pátky | 19h)</option>
                        <option value="851 - TŘEBÍČ">851 - Třebíč (Úterky | 32h)</option>
                        <option value="403 - TŘEBÍČ">403 - Třebíč (Čtvrtky | 19h)</option>
                        <option value="025 - BRNO">025 - Brno (Předposlední st | 3h)</option>
                        <option value="022 - BRNO">022 - Brno (Středy | 14h)</option>
                        <option value="026 - BRNO">026 - Brno (Středy | 14h)</option>
                        <option value="125 - ROSICE">125 - Rosice (Středy | 14h)</option>
                        <option value="OKŘÍŠKY">Okříšky (Předposlední čt | 3h)</option>
                    </select>

                    <input type="text" id="ai-cislo-an" placeholder="Zadej aktuální BÚ / Číslo AN" class="w-full bg-slate-900 border border-amber-500/50 p-3 rounded-xl text-amber-100 outline-none text-xs font-bold">
                    
                    <button id="btn-vygenerovat" onclick="vygenerujAlbertPDF()" class="w-full bg-amber-600 hover:bg-amber-500 py-4 rounded-xl font-bold uppercase tracking-widest text-xs transition-all active:scale-95 shadow-lg shadow-amber-900/20">
                        ⚙️ Vyplnit a stáhnout PDF
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let startTime = null; let timerInterval = null;
        
        // Cíle pro generátor Albert PDF
        const ALBERT_CILY = {
            "171 - TŘEBÍČ": { udrzba: 15, tech: 4, den: 5 }, "851 - TŘEBÍČ": { udrzba: 16, tech: 16, den: 2 }, "403 - TŘEBÍČ": { udrzba: 12, tech: 7, den: 4 }, 
            "022 - BRNO": { udrzba: 8, tech: 6, den: 3 }, "026 - BRNO": { udrzba: 8, tech: 6, den: 3 }, "125 - ROSICE": { udrzba: 8, tech: 6, den: 3 }, 
            "025 - BRNO": { udrzba: 2, tech: 1, den: 3, secondLast: true }, "OKŘÍŠKY": { udrzba: 2, tech: 1, den: 4, secondLast: true } 
        };
        const POPISY = ["oprava obkladů", "čištění odpadů", "oprava dveří", "oprava skříněk", "zapravování, dotažení", "oprava poškozených regálů", "výměna baterie"];

        // 🗺️ GPS LOGIKA PRO AUTOMATICKÝ VÝBĚR BARÁKU
        const GPS_LOKACE = [
            { id: "171 - TŘEBÍČ", lat: 49.214, lon: 15.881, name: "Třebíči" },
            { id: "025 - BRNO", lat: 49.195, lon: 16.606, name: "Brně" },
            { id: "125 - ROSICE", lat: 49.182, lon: 16.387, name: "Rosicích" },
            { id: "OKŘÍŠKY", lat: 49.245, lon: 15.766, name: "Okříškách" },
            { id: "354 - J. HRADEC", lat: 49.144, lon: 15.003, name: "J. Hradci" }
        ];

        function najdiMojiPolohu() {
            if (navigator.geolocation) {
                document.getElementById('gps-status').innerText = "📍 Hledám...";
                document.getElementById('gps-status').classList.remove('hidden');
                
                navigator.geolocation.getCurrentPosition(position => {
                    let userLat = position.coords.latitude;
                    let userLon = position.coords.longitude;
                    
                    // Najít nejbližší město (jednoduchý výpočet vzdálenosti)
                    let nejblizsi = GPS_LOKACE[0];
                    let minVzdalenost = 9999;

                    GPS_LOKACE.forEach(lokace => {
                        let vzd = Math.pow(lokace.lat - userLat, 2) + Math.pow(lokace.lon - userLon, 2);
                        if(vzd < minVzdalenost) { minVzdalenost = vzd; nejblizsi = lokace; }
                    });

                    document.getElementById('prodejna').value = nejblizsi.id;
                    document.getElementById('gps-status').innerText = `📍 JSI V ${nejblizsi.name.toUpperCase()}!`;
                }, () => {
                    document.getElementById('gps-status').innerText = "❌ Poloha odepřena";
                });
            } else {
                alert("Tvůj prohlížeč nepodporuje GPS.");
            }
        }

        window.onload = () => {
            document.getElementById('datum-prace').value = new Date().toISOString().split('T')[0];
            vypocitejStatistiky();
            if (localStorage.getItem('active_timer')) { startTime = new Date(localStorage.getItem('active_timer')); rezimBehu(); }
        };

        // --- FUNKCE DENÍKU (Nezměněno, funguje parádně) ---
        function vymazatData() { if(confirm("Opravdu smazat všechny záznamy z deníku za tento měsíc?")) { localStorage.removeItem('kamil_denik_db'); location.reload(); } }

        function vypocitejStatistiky() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            const m = new Date().toISOString().slice(0, 7); let p = 0;
            db.forEach(z => { if(z.datum.startsWith(m)) p += z.trvani; });
            document.getElementById('stat-hodiny').innerText = `${Math.floor(p/60)}h ${p%60}m`;
        }

        function spustitDiktovani(id) {
            const sr = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            sr.lang = 'cs-CZ'; sr.onresult = (e) => { document.getElementById(id).value += (document.getElementById(id).value ? " " : "") + e.results[0][0].transcript; };
            sr.start();
        }

        function startPrace() { startTime = new Date(); localStorage.setItem('active_timer', startTime.toISOString()); rezimBehu(); }
        function rezimBehu() {
            document.getElementById('btn-start').classList.add('hidden'); document.getElementById('btn-stop').classList.remove('hidden'); document.getElementById('timer-ui').classList.remove('hidden');
            timerInterval = setInterval(() => { document.getElementById('clock').innerText = new Date(new Date() - startTime).toISOString().substr(11, 8); }, 1000);
        }

        function stopPrace() {
            const pr = document.getElementById('prodejna').value;
            if(!pr) return alert("Vyber nejdřív lokalitu!");
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            db.push({ datum: document.getElementById('datum-prace').value, prodejna: pr, popis: document.getElementById('popis').value, trvani: Math.round((new Date() - startTime) / 60000) });
            localStorage.setItem('kamil_denik_db', JSON.stringify(db)); location.reload();
        }

        function generovatReportSefovi() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]"); 
            if (db.length === 0) return alert("Deník je zatím prázdný!");
            let t = "Měsíční report (Deník prací):\n\n"; let celkem = 0;
            db.forEach(z => { t += `- ${z.datum} | ${z.prodejna}: ${(z.trvani/60).toFixed(1)}h (${z.popis})\n`; celkem += z.trvani; });
            t += `\nCelkem odpracováno: ${(celkem/60).toFixed(1)}h`;
            navigator.clipboard.writeText(t).then(() => alert("✅ Report zkopírován do schránky! Můžeš ho vložit do zprávy šéfovi."));
        }

        // --- AUTOMAT NA ALBERT PDF (Nezměněno, funguje parádně) ---
        async function vygenerujAlbertPDF() {
            const fileInput = document.getElementById('pdf-template');
            const btn = document.getElementById('btn-vygenerovat');
            if (!fileInput.files.length) return alert("⚠️ Nejdřív musíš v bodě 1. vybrat prázdný PDF vzor od TSC!");

            const pId = document.getElementById('ai-prodejna').value;
            const an = document.getElementById('ai-cislo-an').value;
            if(!an) return alert("Zadej Číslo AN pro tento výkaz!");

            btn.innerText = "⏳ Vytvářím PDF...";

            try {
                const file = fileInput.files[0];
                const arrayBuffer = await new Promise((resolve, reject) => {
                    const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error("Nelze přečíst PDF.")); reader.readAsArrayBuffer(file);
                });

                const { PDFDocument, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                const page = pdfDoc.getPages()[0]; 

                const fontUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.66/fonts/Roboto/Roboto-Regular.ttf';
                const fontBytes = await fetch(fontUrl).then(res => res.arrayBuffer());
                const customFont = await pdfDoc.embedFont(fontBytes);

                const limit = { ...ALBERT_CILY[pId] };
                const d = new Date(); const rok = d.getFullYear(); const mes = d.getMonth() + 1;
                const pocetDni = new Date(rok, mes, 0).getDate();
                
                let dnyVhodne = [];
                for (let i = 1; i <= pocetDni; i++) { if (new Date(rok, mes-1, i).getDay() === limit.den) dnyVhodne.push(i); }
                if (limit.secondLast && dnyVhodne.length >= 2) dnyVhodne = [dnyVhodne[dnyVhodne.length - 2]];

                let h_u = limit.udrzba > 0 ? limit.udrzba / dnyVhodne.length : 0;
                let h_t = limit.tech > 0 ? limit.tech / dnyVhodne.length : 0;

                let dny = {};
                dnyVhodne.forEach(den => {
                    dny[den] = { u: h_u, t: h_t, p: [], m: [] };
                    if(h_u > 0) { dny[den].p.push(POPISY[Math.floor(Math.random()*POPISY.length)] + ", " + POPISY[Math.floor(Math.random()*POPISY.length)]); dny[den].m.push("Spoj. mat"); }
                });

                const cerna = rgb(0, 0, 0);
                page.drawText(pId.split('-')[0].trim(), { x: 140, y: 652, size: 10, font: customFont, color: cerna });
                page.drawText(`${mes} / ${rok}`, { x: 420, y: 652, size: 10, font: customFont, color: cerna });

                let startY = 515; let radekMezera = 58; let i = 0;
                
                Object.keys(dny).sort((a,b)=>a-b).forEach(den => {
                    let r = dny[den]; let aktualniY = startY - (i * radekMezera); let jeOdecet = (den > 14 && den < 22) ? " + odečty" : "";
                    
                    page.drawText(an, { x: 45, y: aktualniY + 15, size: 10, font: customFont, color: cerna });
                    page.drawText(`${den}.${mes}.`, { x: 45, y: aktualniY, size: 11, font: customFont, color: cerna });

                    if (r.t > 0) page.drawText(`Kontrola teh. a vyhr. zař${jeOdecet}`, { x: 190, y: aktualniY + 15, size: 9, font: customFont, color: cerna });
                    if (r.u > 0) page.drawText(r.p.join(', ').substring(0, 45), { x: 190, y: aktualniY, size: 9, font: customFont, color: cerna });

                    if (r.u > 0) page.drawText(r.m.join(', ').substring(0, 20), { x: 395, y: aktualniY, size: 9, font: customFont, color: cerna });

                    if (r.t > 0) page.drawText(`${r.t.toFixed(1).replace('.',',')}h`, { x: 515, y: aktualniY + 15, size: 11, font: customFont, color: cerna });
                    if (r.u > 0) page.drawText(`${r.u.toFixed(1).replace('.',',')}h`, { x: 515, y: aktualniY, size: 11, font: customFont, color: cerna });
                    i++;
                });

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `Vykaz_Albert_${pId.split('-')[0].trim()}.pdf`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);

                btn.innerText = "✅ Staženo! (Koukni do Souborů)";
                setTimeout(() => { btn.innerText = "⚙️ Vyplnit a stáhnout PDF"; }, 4000);

            } catch (error) {
                console.error(error); alert("🔴 Něco se nepovedlo. Zkus to prosím znovu."); btn.innerText = "⚙️ Vyplnit a stáhnout PDF";
            }
        }
    </script>
</body>
</html>
