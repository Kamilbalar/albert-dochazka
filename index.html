<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albert Facility PRO - Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-4 font-sans text-sm">

    <div class="max-w-md mx-auto bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-blue-400 mb-6 flex items-center gap-2">
                <span>⚡</span> Albert PRO (Cloud)
            </h1>

            <div class="space-y-4">
                <!-- Datum a Prodejna -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Datum</label>
                        <input type="date" id="datum-prace" class="w-full bg-slate-700 p-3 rounded-xl text-white outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Prodejna</label>
                        <select id="prodejna" class="w-full bg-slate-700 p-3 rounded-xl text-white outline-none focus:ring-1 focus:ring-blue-500">
                            <optgroup label="Třebíč">
                                <option value="171">171 - Třebíč</option><option value="851">851 - Třebíč</option>
                                <option value="403">403 - Třebíč</option><option value="735">735 - Třebíč</option>
                            </optgroup>
                            <optgroup label="Brno">
                                <option value="025">025 - Brno</option><option value="022">022 - Brno</option><option value="026">026 - Brno</option>
                            </optgroup>
                            <optgroup label="Ostatní">
                                <option value="125">125 - Rosice</option>
                                <option value="354">354 - J. Hradec</option><option value="334">334 - J. Hradec</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <!-- Poznámka na příště -->
                <div class="bg-yellow-500/10 border border-yellow-500/30 p-3 rounded-xl">
                    <label class="block text-[10px] font-bold text-yellow-500 uppercase mb-1">📝 Poznámka na příště:</label>
                    <textarea id="poznamka-priste" rows="1" class="w-full bg-transparent text-yellow-100 outline-none placeholder:text-yellow-800" placeholder="Co koupit příště..."></textarea>
                </div>

                <!-- Stopky UI -->
                <div id="timer-ui" class="bg-slate-900/50 p-4 rounded-2xl text-center border border-slate-700 hidden">
                    <div id="clock" class="text-3xl font-mono font-bold text-blue-400">00:00:00</div>
                    <span class="text-[10px] text-slate-500 uppercase italic">Čas na prodejně</span>
                </div>

                <!-- Náklady a Foto -->
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="naklady" placeholder="Materiál (Kč)" class="bg-slate-700 p-3 rounded-xl text-center outline-none">
                    <label class="bg-slate-700 p-3 rounded-xl flex justify-center items-center cursor-pointer hover:bg-slate-600 transition">
                        <span id="foto-status">📸 Účtenka</span>
                        <input type="file" id="foto-input" accept="image/*" capture="environment" class="hidden" onchange="zpracujFoto()">
                    </label>
                </div>

                <textarea id="popis" rows="2" class="w-full bg-slate-700 p-4 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="Dnešní popis práce..."></textarea>

                <!-- Tlačítka -->
                <div class="flex gap-2">
                    <button id="btn-start" onclick="startPrace()" class="flex-1 bg-emerald-600 p-4 rounded-xl font-bold shadow-lg hover:bg-emerald-500 active:scale-95 transition-all">START</button>
                    <button id="btn-stop" onclick="stopPrace()" class="hidden flex-1 bg-red-600 p-4 rounded-xl font-bold shadow-lg hover:bg-red-500 active:scale-95 transition-all">STOP & SYNC</button>
                </div>
            </div>
        </div>

        <!-- Historie -->
        <div class="p-6 bg-slate-900/30 border-t border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-slate-300 italic">Poslední záznamy</h2>
                <button onclick="exportovatCSV()" class="text-[10px] bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full border border-blue-500/50">CSV EXPORT</button>
            </div>
            <div id="historie" class="space-y-4 max-h-80 overflow-y-auto pr-2"></div>
        </div>
    </div>

    <script>
        // --- KONFIGURACE ---
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxofi-HJn-QOuT_908ccgA74PgfrQm2ZETr4hgOsgtYFCp59KbmOAP18hQ8kjj_brqk/exec";
        let startTime = null;
        let timerInterval = null;
        let b64Image = "";

        // --- LOGIKA PROGRAMU ---

        window.onload = () => {
            document.getElementById('datum-prace').value = new Date().toISOString().split('T')[0];
            const savedStart = localStorage.getItem('active_timer');
            if (savedStart) {
                startTime = new Date(savedStart);
                rezimBehu();
            }
            vykresliHistorii();
        };

        function startPrace() {
            startTime = new Date();
            localStorage.setItem('active_timer', startTime.toISOString());
            rezimBehu();
        }

        function rezimBehu() {
            document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('btn-stop').classList.remove('hidden');
            document.getElementById('timer-ui').classList.remove('hidden');
            timerInterval = setInterval(() => {
                const diff = new Date(new Date() - startTime);
                document.getElementById('clock').innerText = diff.toISOString().substr(11, 8);
            }, 1000);
        }

        function zpracujFoto() {
            const file = document.getElementById('foto-input').files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                b64Image = reader.result;
                document.getElementById('foto-status').innerText = "✅ FOTO";
            };
            if (file) reader.readAsDataURL(file);
        }

        async function odeslatDoCloudu(zaznam) {
            try {
                // Posíláme pouze textová data, fotka by byla příliš velká pro Apps Script v tomto režimu
                await fetch(CLOUD_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(zaznam)
                });
            } catch (e) {
                console.error("Cloud Error:", e);
            }
        }

        function stopPrace() {
            const endTime = new Date();
            const prodejna = document.getElementById('prodejna').value;
            const popis = document.getElementById('popis').value;
            const naklady = document.getElementById('naklady').value || 0;
            const poznamka = document.getElementById('poznamka-priste').value;
            const datum = document.getElementById('datum-prace').value;

            if (!popis) return alert("Musíš napsat popis práce!");

            const zaznam = {
                datum: datum,
                prodejna: prodejna,
                popis: popis,
                naklady: naklady,
                poznamka: poznamka,
                od: startTime.toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit'}),
                do: endTime.toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit'}),
                trvani: Math.round((endTime - startTime) / 60000)
            };

            // Uložení lokálně (včetně fotky)
            const db = JSON.parse(localStorage.getItem('albert_final_db') || "[]");
            db.push({...zaznam, foto: b64Image});
            localStorage.setItem('albert_final_db', JSON.stringify(db));

            // Odeslání do Google Tabulky
            odeslatDoCloudu(zaznam);

            localStorage.removeItem('active_timer');
            clearInterval(timerInterval);
            alert("Zapsáno! Data se odesílají do tabulky.");
            location.reload(); 
        }

        function vykresliHistorii() {
            const data = JSON.parse(localStorage.getItem('albert_final_db') || "[]").reverse();
            document.getElementById('historie').innerHTML = data.map(z => `
                <div class="bg-slate-700/50 p-4 rounded-2xl border-l-2 border-blue-500 text-xs">
                    <div class="flex justify-between text-slate-500 mb-1">
                        <span>${z.datum} | ${z.od} - ${z.do}</span>
                        <span class="text-emerald-400 font-bold">${z.trvani} min | ${z.naklady} Kč</span>
                    </div>
                    <div class="font-bold text-blue-300">Albert ${z.prodejna}</div>
                    <div class="text-slate-300 mt-1">${z.popis}</div>
                    ${z.poznamka ? `<div class="mt-2 text-yellow-500 italic bg-yellow-500/5 p-2 rounded">📌 Příště: ${z.poznamka}</div>` : ''}
                    ${z.foto ? `<img src="${z.foto}" class="mt-2 w-full h-24 object-cover rounded-lg border border-slate-600">` : ''}
                </div>
            `).join('');
        }

        function exportovatCSV() {
            const data = JSON.parse(localStorage.getItem('albert_final_db') || "[]");
            let csv = "\uFEFFDatum;Prodejna;Od;Do;Minut;Naklady_Kc;Prace;Poznamka_Priste\n";
            data.forEach(z => {
                csv += `${z.datum};${z.prodejna};${z.od};${z.do};${z.trvani};${z.naklady};${z.popis};${z.poznamka}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Vykaz_Albert_Kamil.csv`;
            a.click();
        }
    </script>
</body>
</html>
