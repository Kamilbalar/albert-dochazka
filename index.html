<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamil Facility ULTIMATE PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { font-family: 'Inter', sans-serif; background: #020617; color: #e2e8f0; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .mic-active { animation: pulse-red 1.5s infinite; background: #ef4444 !important; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="p-4 pb-32">

    <div class="max-w-md mx-auto space-y-6">
        
        <div class="glass rounded-[2.5rem] p-6 shadow-2xl flex justify-between items-center border-b-4 border-sky-500">
            <div>
                <h1 class="text-[9px] font-black tracking-widest uppercase opacity-40 mb-1">Status Měsíce</h1>
                <div class="text-3xl font-digital font-bold text-sky-400" id="stat-hodiny">0h 0m</div>
            </div>
            <button onclick="localStorage.removeItem('kamil_denik_db'); location.reload();" class="bg-rose-500/20 text-rose-400 text-[10px] px-4 py-2 rounded-full border border-rose-500/30 font-bold uppercase">Reset</button>
        </div>

        <div class="glass rounded-[2.5rem] p-6 space-y-5">
            <h2 class="text-xs font-black uppercase tracking-widest text-sky-500 flex items-center gap-2">📓 Tvůj deník</h2>
            <div class="grid grid-cols-2 gap-3">
                <input type="date" id="datum-prace" class="bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs outline-none focus:border-sky-500 transition-all">
                <select id="prodejna" class="bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs outline-none focus:border-sky-500 font-bold">
                    <option value="171 - TŘEBÍČ">171 - Třebíč</option>
                    <option value="851 - TŘEBÍČ">851 - Třebíč</option>
                    <option value="403 - TŘEBÍČ">403 - Třebíč</option>
                    <option value="025 - BRNO">025 - Brno</option>
                </select>
            </div>
            <textarea id="popis" rows="2" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-sm outline-none focus:border-sky-500" placeholder="Co jsi dělal?"></textarea>
            <input id="material" type="text" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-sm outline-none focus:border-sky-500" placeholder="Materiál z účtenky...">
            <button onclick="ulozZaznam()" class="w-full bg-gradient-to-r from-sky-600 to-blue-700 py-4 rounded-3xl font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all">Uložit den</button>
            <div id="seznam-zaznamu" class="space-y-3 max-h-48 overflow-y-auto"></div>
        </div>

        <div class="glass rounded-[2.5rem] p-6 bg-amber-500/5 border-amber-500/20 space-y-4">
            <h2 class="text-xs font-black text-amber-500 uppercase tracking-widest">🖨️ Albert PDF Automat</h2>
            
            <div id="pdf-upload-box" class="p-3 bg-slate-900/50 border border-amber-500/30 rounded-xl text-center">
                <input type="file" id="pdf-template" accept="application/pdf" class="hidden" onchange="ulozitVzor(event)">
                <label for="pdf-template" class="cursor-pointer text-[10px] text-amber-500 font-bold uppercase underline">Nahraj PDF vzor (Pouze jednou)</label>
            </div>

            <div class="space-y-3">
                <input type="text" id="ai-cislo-an" placeholder="Číslo AH pro tento měsíc" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs font-bold text-amber-100 outline-none">
                
                <div class="bg-black/30 p-4 rounded-2xl border border-white/5 space-y-4 text-center">
                    <p class="text-[9px] font-bold text-slate-500 uppercase">🛠️ Ladění trefy do modrých linek</p>
                    <div class="flex items-center justify-between px-4">
                        <button onclick="posun(-5)" class="w-10 h-10 glass rounded-full flex items-center justify-center">⬇️</button>
                        <div>
                            <span class="text-[8px] opacity-40 block mb-1 uppercase">Výška (Y)</span>
                            <span id="val-y" class="font-digital text-sky-400">512</span>
                        </div>
                        <button onclick="posun(5)" class="w-10 h-10 glass rounded-full flex items-center justify-center">⬆️</button>
                    </div>
                </div>

                <button id="btn-vygenerovat" onclick="vygenerujAlbertPDF()" class="w-full bg-amber-600 hover:bg-amber-500 py-5 rounded-[2rem] font-black text-sm uppercase tracking-widest active:scale-95 transition-all shadow-2xl">
                    Sestavit a stáhnout PDF
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentY = parseInt(localStorage.getItem('cal_y')) || 512;
        const PRACE_AI = [
            { p: "oprava obkladu a dlazby\ncisteni odpadu v zazemi\nserizeni pantu dveri", m: "lepidlo, silikon\ntesneni, sprej\nspojovaci mat." },
            { p: "oprava poskozenych regalu\ndotazeni ochrannych list\nkontrola osvetleni", m: "vruty, hmozdinky\ntmel, srouby\n1x LED zdroj" },
            { p: "vymena sanitarni techniky\noprava satnich skrinek\nzapravovani der v omitce", m: "1x baterie, silikon\npanty, kovani\nsadra, tmel" }
        ];

        window.onload = () => {
            document.getElementById('datum-prace').value = new Date().toISOString().split('T')[0];
            document.getElementById('val-y').innerText = currentY;
            vypocitejStatistiky(); vykresliDenik();
            if (localStorage.getItem('tsc_vzor_pdf')) document.getElementById('pdf-upload-box').classList.add('hidden');
        };

        function posun(v) { currentY += v; document.getElementById('val-y').innerText = currentY; localStorage.setItem('cal_y', currentY); }
        function ulozitVzor(e) { const reader = new FileReader(); reader.onload = (evt) => { localStorage.setItem('tsc_vzor_pdf', evt.target.result); location.reload(); }; reader.readAsDataURL(e.target.files[0]); }
        
        function ulozZaznam() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            db.push({ datum: document.getElementById('datum-prace').value, prodejna: document.getElementById('prodejna').value, popis: document.getElementById('popis').value, material: document.getElementById('material').value, trvani: 60 });
            localStorage.setItem('kamil_denik_db', JSON.stringify(db));
            location.reload();
        }

        function vykresliDenik() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            document.getElementById('seznam-zaznamu').innerHTML = db.slice(-3).reverse().map(z => `
                <div class="glass p-3 rounded-2xl text-[10px] opacity-70 border-l-4 border-sky-500">
                    <span class="font-bold">${z.datum}</span> | ${z.prodejna}<br>${z.popis}
                </div>
            `).join('');
        }

        function vypocitejStatistiky() { const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]"); let m = 0; db.forEach(z => m += z.trvani); document.getElementById('stat-hodiny').innerText = `${Math.floor(m/60)}h ${m%60}m`; }

        async function vygenerujAlbertPDF() {
            const base64 = localStorage.getItem('tsc_vzor_pdf'); if(!base64) return alert("Nahraj vzor!");
            const an = document.getElementById('ai-cislo-an').value; if(!an) return alert("Zadej AN!");
            const btn = document.getElementById('btn-vygenerovat'); btn.innerText = "⏳ Pracuji...";

            try {
                const arrayBuffer = await fetch(base64).then(res => res.arrayBuffer());
                const { PDFDocument, StandardFonts, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
                const page = pdfDoc.getPages()[0];
                const prodejna = document.getElementById('prodejna').value;
                const mesic = new Date().getMonth() + 1;
                
                page.drawText(prodejna.split('-')[0].trim(), { x: 155, y: 648, size: 11, font: font });
                page.drawText(`${mesic} / 2026`, { x: 425, y: 648, size: 11, font: font });

                const dny = [7, 14, 21, 28];
                dny.forEach((den, i) => {
                    let y = currentY - (i * 70); // 👈 PEVNÝ ROZESTUP PRO MODRÉ BUŇKY
                    
                    page.drawText(an, { x: 45, y: y, size: 9, font: font });
                    page.drawText(`${den}.${mesic}.`, { x: 45, y: y - 12, size: 11, font: font });

                    page.drawText("kontrola teh.", { x: 188, y: y, size: 10, font: font });
                    page.drawText("1.0h", { x: 518, y: y, size: 11, font: font });

                    let y2 = y - 12;
                    if(i === 2) { page.drawText("odecty energii", { x: 188, y: y2, size: 10, font: font }); y2 -= 12; }
                    
                    const item = PRACE_AI[i % PRACE_AI.length];
                    page.drawText(item.p, { x: 188, y: y2, size: 10, font: font, lineHeight: 11 });
                    page.drawText(item.m, { x: 395, y: y2, size: 9, font: font, lineHeight: 11 });
                    page.drawText("3.0h", { x: 518, y: y2, size: 11, font: font });
                });

                const pdfBytes = await pdfDoc.save();
                const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' })); link.download = `Vykaz_${prodejna.split(' ')[0]}.pdf`; link.click();
                btn.innerText = "✅ Hotovo"; setTimeout(() => btn.innerText = "Sestavit a stáhnout PDF", 3000);
            } catch (e) { alert("CHYBA: " + e.message); btn.innerText = "Zkusit znovu"; }
        }
    </script>
</body>
</html>
