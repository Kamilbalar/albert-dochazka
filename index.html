<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albert Facility PRO - Viditelný Deník</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-text-blue { text-shadow: 0 0 10px rgba(56, 189, 248, 0.8); }
    </style>
</head>
<body class="bg-[#050b14] text-slate-100 p-4 font-sans text-sm pb-10 min-h-screen">

    <div class="max-w-md mx-auto glass-panel rounded-[2rem] shadow-2xl overflow-hidden relative">
        
        <div class="bg-gradient-to-r from-blue-900/50 to-cyan-900/30 p-5 border-b border-cyan-500/20 text-center flex justify-between items-center">
            <div class="text-left">
                <div class="text-[9px] text-cyan-400 uppercase font-black tracking-widest mb-1 opacity-80">Tvůj deník (Odpracováno)</div>
                <div class="text-2xl font-digital font-bold text-white neon-text-blue" id="stat-hodiny">0h 0m</div>
            </div>
            <button onclick="vymazatCelyDenik()" class="text-[8px] bg-red-900/50 text-red-400 px-3 py-2 rounded-xl border border-red-500/30 uppercase font-bold active:scale-95 transition-all">Vymazat<br>Vše</button>
        </div>

        <div class="p-6 space-y-6">
            
            <div class="bg-slate-800/30 p-5 rounded-2xl border border-slate-700/50">
                <h2 class="text-xs font-black text-cyan-400 uppercase tracking-widest mb-4">📓 Zápis do deníku</h2>
                
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input type="date" id="datum-prace" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 rounded-xl text-cyan-100 outline-none text-xs">
                    <select id="prodejna" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 rounded-xl text-cyan-100 outline-none text-xs">
                        <option value="">Lokalita...</option>
                        <option value="171 - TŘEBÍČ">171 - Třebíč</option><option value="851 - TŘEBÍČ">851 - Třebíč</option><option value="403 - TŘEBÍČ">403 - Třebíč</option>
                        <option value="025 - BRNO">025 - Brno</option><option value="022 - BRNO">022 - Brno</option><option value="026 - BRNO">026 - Brno</option><option value="125 - ROSICE">125 - Rosice</option>
                        <option value="OKŘÍŠKY">Okříšky</option><option value="354 - J. HRADEC">354 - J. Hradec</option>
                    </select>
                </div>

                <div class="relative mb-2">
                    <textarea id="popis" rows="2" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 pr-10 rounded-xl text-cyan-50 outline-none text-xs" placeholder="Popis práce (nadiktuj)..."></textarea>
                    <button onclick="spustitDiktovani('popis')" class="absolute top-2 right-2 text-lg">🎙️</button>
                </div>

                <div class="relative mb-4">
                    <input id="material" type="text" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 pr-10 rounded-xl text-emerald-100 outline-none text-xs" placeholder="Materiál z účtenky (nadiktuj)...">
                    <button onclick="spustitDiktovani('material')" class="absolute top-3 right-2 text-lg">🎙️</button>
                </div>

                <div id="timer-ui" class="bg-[#020617] p-4 rounded-xl text-center border border-cyan-500/30 hidden mb-4">
                    <div id="clock" class="text-4xl font-digital font-black text-white neon-text-blue">00:00:00</div>
                </div>
                
                <button id="btn-start" onclick="startPrace()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-black text-sm uppercase tracking-widest active:scale-95 transition-all shadow-lg">START STOPKY</button>
                
                <div id="stop-controls" class="hidden space-y-2">
                    <button onclick="stopPrace()" class="w-full bg-red-600 hover:bg-red-500 py-4 rounded-xl font-black text-sm uppercase tracking-widest active:scale-95 transition-all shadow-lg">UKONČIT & ULOŽIT</button>
                    <button onclick="ulozRucne()" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold text-xs uppercase tracking-widest text-slate-300">Zapsat čas ručně (Zastaví stopky)</button>
                </div>

                <div class="mt-6 border-t border-slate-700/50 pt-4">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 flex justify-between items-center">
                        <span>📝 Tvé záznamy</span>
                        <button onclick="generovatReportSefovi()" class="text-cyan-400 hover:underline">📋 Kopírovat</button>
                    </h3>
                    
                    <div id="seznam-zaznamu" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        </div>
                </div>
            </div>

            <div class="bg-amber-900/20 border border-amber-500/30 p-5 rounded-2xl relative">
                <h2 class="text-xs font-black text-amber-500 uppercase tracking-widest mb-4">🖨️ Zápis do originálního PDF</h2>
                
                <div id="pdf-upload-box" class="mb-4 bg-slate-900/80 border border-amber-500/30 p-3 rounded-xl">
                    <label class="block text-[9px] font-bold text-amber-300 uppercase tracking-widest mb-2">Nahraj prázdný vzor (Pouze jednou!)</label>
                    <input type="file" id="pdf-template" accept="application/pdf" class="w-full text-xs text-slate-300 outline-none" onchange="ulozitVzor(event)">
                </div>

                <div id="pdf-ready-box" class="mb-4 bg-emerald-900/40 border border-emerald-500/50 p-3 rounded-xl hidden text-center">
                    <span class="text-xs font-bold text-emerald-400">✅ Prázdný vzor PDF je trvale v paměti</span>
                    <button onclick="smazatVzor()" class="text-[9px] text-emerald-200 block w-full mt-1 underline">Chci nahrát nový vzor</button>
                </div>

                <div class="space-y-4">
                    <select id="ai-prodejna" class="w-full bg-slate-900 border border-amber-500/50 p-3 rounded-xl text-amber-100 outline-none text-xs font-bold">
                        <option value="171 - TŘEBÍČ">171 - Třebíč (Pátky | 19h)</option>
                        <option value="851 - TŘEBÍČ">851 - Třebíč (Úterky | 32h)</option>
                        <option value="403 - TŘEBÍČ">403 - Třebíč (Čtvrtky | 19h)</option>
                        <option value="025 - BRNO">025 - Brno (Předposlední st | 3h)</option>
                        <option value="022 - BRNO">022 - Brno (Středy | 14h)</option>
                        <option value="026 - BRNO">026 - Brno (Středy | 14h)</option>
                        <option value="125 - ROSICE">125 - Rosice (Středy | 14h)</option>
                        <option value="OKŘÍŠKY">Okříšky (Předposlední čt | 3h)</option>
                    </select>

                    <input type="text" id="ai-cislo-an" placeholder="Zadej aktuální BÚ / Číslo AN" class="w-full bg-slate-900 border border-amber-500/50 p-3 rounded-xl text-amber-100 outline-none text-xs font-bold">
                    
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700">
                        <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-2">🛠️ Kalibrace zarovnání prvního řádku</label>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <span class="text-[8px] text-slate-500">První řádek (Zvyš=Výš)</span>
                                <input type="number" id="cal-y" value="510" class="w-full bg-black/50 border border-slate-600 p-2 text-xs text-white rounded outline-none" onchange="ulozKalibraci()">
                            </div>
                            <div>
                                <span class="text-[8px] text-slate-500">Skok do další buňky</span>
                                <input type="number" id="cal-space" value="70" class="w-full bg-black/50 border border-slate-600 p-2 text-xs text-white rounded outline-none" onchange="ulozKalibraci()">
                            </div>
                        </div>
                    </div>

                    <button id="btn-vygenerovat" onclick="vygenerujAlbertPDF()" class="w-full bg-amber-600 hover:bg-amber-500 py-4 rounded-xl font-bold uppercase tracking-widest text-xs transition-all active:scale-95 shadow-lg">
                        ⚙️ Zapsat a stáhnout PDF
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let startTime = null; let timerInterval = null;
        
        const ALBERT_CILY = {
            "171 - TŘEBÍČ": { udrzba: 15, tech: 4, den: 5 }, "851 - TŘEBÍČ": { udrzba: 16, tech: 16, den: 2 }, "403 - TŘEBÍČ": { udrzba: 12, tech: 7, den: 4 }, 
            "022 - BRNO": { udrzba: 8, tech: 6, den: 3 }, "026 - BRNO": { udrzba: 8, tech: 6, den: 3 }, "125 - ROSICE": { udrzba: 8, tech: 6, den: 3 }, 
            "025 - BRNO": { udrzba: 2, tech: 1, den: 3, secondLast: true }, "OKŘÍŠKY": { udrzba: 2, tech: 1, den: 4, secondLast: true } 
        };
        const P_U = ["oprava obkladů", "čištění odpadů", "oprava dveří", "oprava skříněk", "zapravování zdiva", "oprava poškozených regálů", "výměna baterie", "oprava dlažby", "seřízení pantů", "dotažení lišt"];
        const MATS = ["Spoj. mat", "Lepidlo", "Silikon", "1x baterie", "Sprej", "Panty", "Tmel"];

        window.onload = () => {
            document.getElementById('datum-prace').value = new Date().toISOString().split('T')[0];
            vypocitejStatistiky();
            vykresliZaznamy(); // <--- Zobrazení deníku po spuštění
            
            if (localStorage.getItem('active_timer')) { startTime = new Date(localStorage.getItem('active_timer')); rezimBehu(); }
            if (localStorage.getItem('tsc_vzor_pdf')) {
                document.getElementById('pdf-upload-box').classList.add('hidden');
                document.getElementById('pdf-ready-box').classList.remove('hidden');
            }
            if (localStorage.getItem('cal_y')) document.getElementById('cal-y').value = localStorage.getItem('cal_y');
            if (localStorage.getItem('cal_space')) document.getElementById('cal-space').value = localStorage.getItem('cal_space');
        };

        // --- PDF PAMĚŤ A KALIBRACE ---
        function ulozitVzor(e) {
            const file = e.target.files[0]; const reader = new FileReader();
            reader.onload = function(evt) {
                localStorage.setItem('tsc_vzor_pdf', evt.target.result);
                document.getElementById('pdf-upload-box').classList.add('hidden');
                document.getElementById('pdf-ready-box').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
        function smazatVzor() { localStorage.removeItem('tsc_vzor_pdf'); document.getElementById('pdf-upload-box').classList.remove('hidden'); document.getElementById('pdf-ready-box').classList.add('hidden'); }
        function ulozKalibraci() { localStorage.setItem('cal_y', document.getElementById('cal-y').value); localStorage.setItem('cal_space', document.getElementById('cal-space').value); }

        // --- MOZEK DENÍKU ---
        function vymazatCelyDenik() { if(confirm("Opravdu smazat VŠE z deníku?")) { localStorage.removeItem('kamil_denik_db'); location.reload(); } }
        
        function vypocitejStatistiky() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            const m = new Date().toISOString().slice(0, 7); let p = 0;
            db.forEach(z => { if(z.datum.startsWith(m)) p += z.trvani; });
            document.getElementById('stat-hodiny').innerText = `${Math.floor(p/60)}h ${p%60}m`;
        }

        // ZDE JE NOVÁ FUNKCE, KTERÁ VYTVÁŘÍ TY ULOŽENÉ BLOKY
        function vykresliZaznamy() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            const box = document.getElementById('seznam-zaznamu');
            box.innerHTML = "";
            
            if(db.length === 0) {
                box.innerHTML = "<div class='text-center text-[10px] text-slate-500 py-4'>Zatím tu nic nemáš. Začni měřit nahoře.</div>";
                return;
            }

            // Výpis od nejnovějšího po nejstarší
            [...db].reverse().forEach((z, reversedIndex) => {
                const realIndex = db.length - 1 - reversedIndex; // Potřebujeme reálné ID kvůli mazání
                box.innerHTML += `
                    <div class="bg-slate-900/80 border border-slate-700 p-3 rounded-xl flex justify-between items-center relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-cyan-500"></div>
                        <div class="pl-2">
                            <div class="text-[10px] font-bold text-cyan-300">${z.datum.split('-').reverse().join('.')} | <span class="text-white">${z.prodejna}</span></div>
                            <div class="text-[9px] text-slate-400 mt-1">${z.popis || 'Bez popisu práce'}</div>
                            ${z.material ? `<div class="text-[8px] text-emerald-400 mt-0.5">Mat: ${z.material}</div>` : ''}
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-bold text-white">${(z.trvani/60).toFixed(1)}h</div>
                            <button onclick="smazZaznam(${realIndex})" class="text-[8px] text-red-500 mt-1 hover:underline">Smazat</button>
                        </div>
                    </div>
                `;
            });
        }

        function smazZaznam(index) {
            if(confirm("Opravdu smazat tento jeden záznam?")) {
                const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
                db.splice(index, 1);
                localStorage.setItem('kamil_denik_db', JSON.stringify(db));
                vypocitejStatistiky();
                vykresliZaznamy();
            }
        }

        function spustitDiktovani(id) {
            const sr = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            sr.lang = 'cs-CZ'; sr.onresult = (e) => { document.getElementById(id).value += (document.getElementById(id).value ? " " : "") + e.results[0][0].transcript; };
            sr.start();
        }

        function startPrace() { 
            startTime = new Date(); localStorage.setItem('active_timer', startTime.toISOString()); rezimBehu(); 
        }
        
        function rezimBehu() {
            document.getElementById('btn-start').classList.add('hidden'); 
            document.getElementById('stop-controls').classList.remove('hidden'); 
            document.getElementById('timer-ui').classList.remove('hidden');
            timerInterval = setInterval(() => { document.getElementById('clock').innerText = new Date(new Date() - startTime).toISOString().substr(11, 8); }, 1000);
        }
        
        function stopPrace() {
            ulozZaznam(Math.round((new Date() - startTime) / 60000));
        }

        function ulozRucne() {
            const min = prompt("Kolik minut si chceš zapsat ručně? (např. 120 pro 2 hodiny)");
            if(min && !isNaN(min)) {
                ulozZaznam(parseInt(min));
            }
        }

        function ulozZaznam(trvaniMinuty) {
            const pr = document.getElementById('prodejna').value; if(!pr) return alert("Vyber nejdřív lokalitu!");
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            db.push({ datum: document.getElementById('datum-prace').value, prodejna: pr, popis: document.getElementById('popis').value, material: document.getElementById('material').value, trvani: trvaniMinuty });
            localStorage.setItem('kamil_denik_db', JSON.stringify(db)); 
            localStorage.removeItem('active_timer');
            location.reload();
        }

        function generovatReportSefovi() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]"); 
            if (db.length === 0) return alert("Deník je zatím prázdný!");
            let t = "Měsíční report:\n\n"; let celkem = 0;
            db.forEach(z => { t += `- ${z.datum} | ${z.prodejna}: ${(z.trvani/60).toFixed(1)}h (${z.popis})\n`; celkem += z.trvani; });
            t += `\nCelkem: ${(celkem/60).toFixed(1)}h`;
            navigator.clipboard.writeText(t).then(() => alert("✅ Report zkopírován!"));
        }

        // --- AUTOMAT NA ALBERT PDF ---
        function rozdelHodiny(celkem, pocet) {
            let v = new Array(pocet).fill(0);
            if (pocet === 0 || celkem <= 0) return v;
            celkem = Math.round(celkem * 2) / 2; 
            let zbytek = celkem;
            let prumer = Math.floor((celkem / pocet) * 2) / 2; 
            for(let i=0; i<pocet; i++) { v[i] = prumer; zbytek -= prumer; }
            let idx = 0;
            while(zbytek >= 0.5 && zbytek < 100) { v[idx] += 0.5; zbytek -= 0.5; idx = (idx + 1) % pocet; }
            return v;
        }

        async function vygenerujAlbertPDF() {
            const base64Pdf = localStorage.getItem('tsc_vzor_pdf');
            if (!base64Pdf) return alert("⚠️ Nahraj nejdřív čistý vzor TSC do paměti!");

            const pId = document.getElementById('ai-prodejna').value;
            const an = document.getElementById('ai-cislo-an').value;
            if(!an) return alert("Zadej Číslo AN!");

            const btn = document.getElementById('btn-vygenerovat');
            btn.innerText = "⏳ Vytvářím čistý výkaz...";

            try {
                const arrayBuffer = await fetch(base64Pdf).then(res => res.arrayBuffer());

                const { PDFDocument, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                pdfDoc.registerFontkit(window.fontkit);
                const page = pdfDoc.getPages()[0]; 

                const fontUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.66/fonts/Roboto/Roboto-Regular.ttf';
                const fontBytes = await fetch(fontUrl).then(res => res.arrayBuffer());
                const customFont = await pdfDoc.embedFont(fontBytes);

                const limit = { ...ALBERT_CILY[pId] };
                const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
                const d = new Date(); const rok = d.getFullYear(); const mes = d.getMonth() + 1;
                const prefix = `${rok}-${String(mes).padStart(2, '0')}`;
                const pocetDni = new Date(rok, mes, 0).getDate();
                
                let dnyVhodne = [];
                for (let i = 1; i <= pocetDni; i++) { if (new Date(rok, mes-1, i).getDay() === limit.den) dnyVhodne.push(i); }
                if (limit.secondLast && dnyVhodne.length >= 2) dnyVhodne = [dnyVhodne[dnyVhodne.length - 2]];

                let dny = {};
                
                db.filter(z => z.prodejna === pId && z.datum.startsWith(prefix)).forEach(z => {
                    let den = parseInt(z.datum.split('-')[2]);
                    if(!dny[den]) dny[den] = { u: 0, t: 0, p: [], m: [] };
                    
                    let udrzbaHod = Math.round((z.trvani / 60) * 2) / 2;
                    dny[den].u += udrzbaHod;
                    if(z.popis) dny[den].p.push(z.popis); 
                    if(z.material) dny[den].m.push(z.material);
                    
                    limit.udrzba -= udrzbaHod;
                });
                if(limit.udrzba < 0) limit.udrzba = 0;

                let rozvrhU = rozdelHodiny(limit.udrzba, dnyVhodne.length);
                let rozvrhT = rozdelHodiny(limit.tech, dnyVhodne.length);

                dnyVhodne.forEach((den, index) => {
                    if(!dny[den]) dny[den] = { u: 0, t: 0, p: [], m: [] };
                    dny[den].u += rozvrhU[index];
                    dny[den].t += rozvrhT[index];
                    
                    if(rozvrhU[index] > 0) { 
                        dny[den].p.push(P_U[Math.floor(Math.random()*P_U.length)]);
                        if(rozvrhU[index] >= 2) dny[den].p.push(P_U[Math.floor(Math.random()*P_U.length)]); 
                        
                        let rMat = MATS[Math.floor(Math.random()*MATS.length)];
                        if (rMat) dny[den].m.push(rMat); 
                    }
                });

                const cerna = rgb(0, 0, 0);
                page.drawText(pId.split('-')[0].trim(), { x: 160, y: 645, size: 10, font: customFont, color: cerna });
                page.drawText(`${mes} / ${rok}`, { x: 420, y: 645, size: 10, font: customFont, color: cerna });

                let startY = parseInt(document.getElementById('cal-y').value);  
                let radekMezera = parseInt(document.getElementById('cal-space').value); 
                
                let i = 0;
                Object.keys(dny).sort((a,b)=>a-b).forEach(den => {
                    let r = dny[den];
                    let topY = startY - (i * radekMezera); 
                    let bottomY = topY - (radekMezera / 2) - 5; 
                    
                    page.drawText(an, { x: 50, y: topY, size: 9, font: customFont, color: cerna });
                    page.drawText(`${den}.${mes}.`, { x: 50, y: topY - 12, size: 10, font: customFont, color: cerna });

                    let textLines = []; let matLines = []; let hourLines = [];

                    if (r.t > 0) {
                        textLines.push("kontrola teh."); matLines.push(""); hourLines.push(`${r.t.toFixed(1).replace('.',',')}h`);
                        if (pId.includes("851") || pId.includes("403")) {
                            textLines.push("kon. nev. vyhr. tech. zař."); matLines.push(""); hourLines.push("");
                        }
                        if (den > 14 && den < 22) {
                            textLines.push("odečty energií"); matLines.push(""); hourLines.push("");
                        }
                    }

                    if (r.u > 0) {
                        for (let lineIndex = 0; lineIndex < r.p.length; lineIndex++) {
                            textLines.push(r.p[lineIndex]);
                            if (lineIndex === 0 && r.m.length > 0) { matLines.push(r.m.join(', ')); } else { matLines.push(""); }
                            if (lineIndex === 0) { hourLines.push(`${r.u.toFixed(1).replace('.',',')}h`); } else { hourLines.push(""); }
                        }
                    }

                    let fontSize = 11; let lineH = 15; 
                    page.drawText(textLines.join('\n'), { x: 185, y: topY, size: fontSize, font: customFont, color: cerna, lineHeight: lineH });
                    page.drawText(matLines.join('\n'), { x: 400, y: topY, size: fontSize, font: customFont, color: cerna, lineHeight: lineH });
                    page.drawText(hourLines.join('\n'), { x: 520, y: topY, size: 12, font: customFont, color: cerna, lineHeight: lineH });

                    i++;
                });

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `Vykaz_Albert_${pId.split('-')[0].trim()}.pdf`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);

                btn.innerText = "✅ Staženo! (Koukni do Souborů)";
                setTimeout(() => { btn.innerText = "⚙️ Zapsat a stáhnout PDF"; }, 4000);

            } catch (error) {
