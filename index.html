<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamil PRO Facility OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { font-family: 'Inter', sans-serif; background: #020617; color: #e2e8f0; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .mic-active { animation: pulse-red 1.5s infinite; background: #ef4444 !important; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="p-4 pb-32">

    <div class="max-w-md mx-auto space-y-6">
        
        <div class="glass rounded-[2.5rem] p-6 shadow-2xl flex justify-between items-center border-b-4 border-sky-500">
            <div>
                <h1 class="text-[9px] font-black tracking-widest uppercase opacity-40 mb-1">Měsíční Status</h1>
                <div class="text-3xl font-digital font-bold text-sky-400" id="stat-hodiny">0h 0m</div>
                <div class="text-[10px] text-emerald-400 font-bold mt-1" id="stat-penize">0 Kč</div>
            </div>
            <button onclick="resetMesic()" class="bg-rose-500/20 text-rose-400 text-[10px] px-4 py-2 rounded-full border border-rose-500/30 font-bold uppercase">Reset</button>
        </div>

        <div class="glass rounded-[2.5rem] p-6 space-y-5">
            <h2 class="text-xs font-black uppercase tracking-widest text-sky-500 flex items-center gap-2">📓 Tvůj deník (pro šéfa)</h2>

            <div class="grid grid-cols-2 gap-3">
                <input type="date" id="datum-prace" class="bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs outline-none focus:border-sky-500 transition-all text-white">
                <select id="prodejna" class="bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs outline-none focus:border-sky-500 font-bold text-white">
                    <option value="171 - TŘEBÍČ">171 - Třebíč</option>
                    <option value="851 - TŘEBÍČ">851 - Třebíč</option>
                    <option value="403 - TŘEBÍČ">403 - Třebíč</option>
                    <option value="025 - BRNO">025 - Brno</option>
                    <option value="OKŘÍŠKY">Okříšky</option>
                    <option value="354 - J. HRADEC">354 - J. Hradec</option>
                </select>
            </div>

            <div class="relative">
                <textarea id="popis" rows="2" class="w-full bg-slate-900 border border-slate-700 p-4 pr-12 rounded-2xl text-sm outline-none focus:border-sky-500 text-white" placeholder="Co jsi dělal?"></textarea>
                <button id="mic-popis" onclick="toggleMic('popis')" class="absolute right-3 top-3 w-10 h-10 bg-slate-800 rounded-xl flex items-center justify-center text-xl">🎙️</button>
            </div>

            <div class="relative">
                <input id="material-rucni" type="text" class="w-full bg-slate-900 border border-slate-700 p-4 pr-12 rounded-2xl text-sm outline-none focus:border-sky-500 text-white" placeholder="Materiál z účtenky...">
                <button id="mic-mat" onclick="toggleMic('material-rucni')" class="absolute right-3 top-2 w-10 h-10 bg-slate-800 rounded-xl flex items-center justify-center text-xl">🎙️</button>
            </div>

            <div id="timer-ui" class="hidden bg-black/40 p-4 rounded-2xl text-center border border-sky-500/30">
                <div id="clock" class="text-3xl font-digital text-white">00:00:00</div>
            </div>

            <button id="btn-start" onclick="startTimer()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-3xl font-black text-xs uppercase tracking-widest shadow-xl transition-all">Start Stopky</button>
            <div id="stop-controls" class="hidden space-y-2">
                <button onclick="ulozZaznam(false)" class="w-full bg-rose-600 py-4 rounded-3xl font-black text-xs uppercase tracking-widest">Ukončit & Uložit</button>
                <button onclick="ulozZaznam(true)" class="w-full bg-slate-700 py-3 rounded-3xl font-bold text-[10px] uppercase text-slate-300">Zapsat čas ručně</button>
            </div>

            <div class="pt-4 border-t border-slate-700/50">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-bold text-slate-500 uppercase">Poslední práce</span>
                    <button onclick="copyDeník()" class="text-sky-400 text-[10px] font-bold uppercase">Kopírovat pro šéfa</button>
                </div>
                <div id="seznam-zaznamu" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </div>

        <div class="glass rounded-[2.5rem] p-6 bg-amber-500/5 border-amber-500/20 space-y-4">
            <h2 class="text-xs font-black text-amber-500 uppercase tracking-widest">🖨️ Albert PDF Automat</h2>
            
            <input type="file" id="pdf-template" accept="application/pdf" class="hidden" onchange="ulozitVzor(event)">
            <label for="pdf-template" id="vzor-label" class="cursor-pointer block text-center p-3 border border-dashed border-amber-500/30 rounded-xl text-[10px] text-amber-500 uppercase">VZOR PDF ULOŽEN ✅</label>

            <input type="text" id="ai-cislo-an" placeholder="Číslo AH (např. Ap38383)" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-xs font-bold text-amber-100 outline-none">
            
            <div class="bg-black/30 p-4 rounded-3xl border border-white/5 space-y-4">
                <p class="text-[9px] font-bold text-slate-500 uppercase text-center">Jemné ladění (Y = Výška | X = Zleva)</p>
                <div class="grid grid-cols-2 gap-4">
                    <div class="text-center">
                        <span class="text-[8px] opacity-40 block mb-1 uppercase text-white">Nahoru/Dolů (Y)</span>
                        <div class="flex items-center justify-between bg-slate-900 rounded-xl p-1">
                            <button onclick="adj('cal_y', -2)" class="p-2 text-sky-400">⬇️</button>
                            <span id="val-y" class="font-digital text-xs text-white">525</span>
                            <button onclick="adj('cal_y', 2)" class="p-2 text-sky-400">⬆️</button>
                        </div>
                    </div>
                    <div class="text-center">
                        <span class="text-[8px] opacity-40 block mb-1 uppercase text-white">Doleva/Doprava (X)</span>
                        <div class="flex items-center justify-between bg-slate-900 rounded-xl p-1">
                            <button onclick="adj('cal_x', -5)" class="p-2 text-sky-400">⬅️</button>
                            <span id="val-x" class="font-digital text-xs text-white">60</span>
                            <button onclick="adj('cal_x', 5)" class="p-2 text-sky-400">➡️</button>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="vygenerujAlbertPDF()" class="w-full bg-amber-600 hover:bg-amber-500 py-5 rounded-[2rem] font-black text-sm uppercase tracking-widest shadow-2xl transition-all">
                Sestavit a stáhnout PDF
            </button>
        </div>
    </div>

    <script>
        let startTime = null; let timerInt = null; let recognition = null; let isMic = false;

        window.onload = () => {
            document.getElementById('datum-prace').value = new Date().toISOString().split('T')[0];
            vypocitejStats(); vykresliDenik();
            document.getElementById('val-y').innerText = localStorage.getItem('cal_y') || 525;
            document.getElementById('val-x').innerText = localStorage.getItem('cal_x') || 60;
            if (!localStorage.getItem('tsc_vzor_pdf')) document.getElementById('vzor-label').innerText = "NAHRAJ VZOR PDF";
        };

        // --- DIKTOVÁNÍ (NEKONČÍCÍ) ---
        function toggleMic(id) {
            if (isMic) { recognition.stop(); return; }
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'cs-CZ'; recognition.continuous = true;
            recognition.onstart = () => { isMic = true; document.getElementById('mic-'+(id==='popis'?'popis':'mat')).classList.add('mic-active'); };
            recognition.onresult = (e) => { document.getElementById(id).value += e.results[e.results.length-1][0].transcript; };
            recognition.onend = () => { isMic = false; document.getElementById('mic-popis').classList.remove('mic-active'); document.getElementById('mic-mat').classList.remove('mic-active'); };
            recognition.start();
        }

        // --- STOPKY A DENÍK ---
        function startTimer() {
            startTime = new Date(); document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('stop-controls').classList.remove('hidden'); document.getElementById('timer-ui').classList.remove('hidden');
            timerInt = setInterval(() => { document.getElementById('clock').innerText = new Date(new Date() - startTime).toISOString().substr(11, 8); }, 1000);
        }

        function ulozZaznam(rucne) {
            let minuty = rucne ? parseInt(prompt("Zadej počet minut:")) : Math.round((new Date() - startTime) / 60000);
            if (!minuty) return;
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            db.push({ datum: document.getElementById('datum-prace').value, prodejna: document.getElementById('prodejna').value, popis: document.getElementById('popis').value, material: document.getElementById('material-rucni').value, trvani: minuty });
            localStorage.setItem('kamil_denik_db', JSON.stringify(db)); location.reload();
        }

        function resetMesic() { if(confirm("Smazat měsíc?")) { localStorage.removeItem('kamil_denik_db'); location.reload(); } }
        function vypocitejStats() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]"); let m = 0; db.forEach(z => m += z.trvani);
            document.getElementById('stat-hodiny').innerText = `${Math.floor(m/60)}h ${m%60}m`;
            document.getElementById('stat-penize').innerText = (Math.floor(m/60) * 350).toLocaleString() + " Kč";
        }
        function vykresliDenik() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            document.getElementById('seznam-zaznamu').innerHTML = db.slice(-5).reverse().map((z, i) => `
                <div class="glass p-3 rounded-2xl flex justify-between items-center text-[10px]">
                    <div><span class="text-sky-400 font-bold">${z.datum.split('-').reverse().join('.')}</span> | ${z.prodejna.split(' ')[0]}<br>${z.popis}</div>
                    <div class="font-bold">${(z.trvani/60).toFixed(1)}h</div>
                </div>
            `).join('');
        }
        function copyDeník() {
            const db = JSON.parse(localStorage.getItem('kamil_denik_db') || "[]");
            let t = db.map(z => `${z.datum} | ${z.prodejna}: ${z.popis} (${(z.trvani/60).toFixed(1)}h)`).join('\n');
            navigator.clipboard.writeText(t).then(() => alert("Zkopírováno!"));
        }

        // --- PDF LOGIKA ---
        function adj(key, val) {
            let n = parseInt(localStorage.getItem(key) || (key==='cal_y'?525:60)) + val;
            localStorage.setItem(key, n); document.getElementById(key==='cal_y'?'val-y':'val-x').innerText = n;
        }
        function ulozitVzor(e) { const reader = new FileReader(); reader.onload = (evt) => { localStorage.setItem('tsc_vzor_pdf', evt.target.result); location.reload(); }; reader.readAsDataURL(e.target.files[0]); }

        async function vygenerujAlbertPDF() {
            const base64 = localStorage.getItem('tsc_vzor_pdf'); if(!base64) return alert("Nahraj vzor!");
            const an = document.getElementById('ai-cislo-an').value; if(!an) return alert("Zadej AN!");
            try {
                const { PDFDocument, StandardFonts, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.load(await fetch(base64).then(res => res.arrayBuffer()));
                const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
                const page = pdfDoc.getPages()[0];
                const mesic = new Date().getMonth() + 1;
                const cy = parseInt(localStorage.getItem('cal_y') || 525);
                const cx = parseInt(localStorage.getItem('cal_x') || 60);

                page.drawText('171', { x: 235, y: 668, size: 12, font: font });
                page.drawText(`${mesic} / 2026`, { x: 670, y: 668, size: 12, font: font });

                const PRACE = [
                    { p: "kontrola teh.\noprava obkladu a dlazby\ncisteni odpadu v zazemi\nserizeni pantu dveri", m: "lepidlo, silikon\ntesneni, sprej\nspojovaci mat." },
                    { p: "kontrola teh.\noprava poskozenych regalu\ndotazeni ochrannych list\nkontrola osvetleni", m: "vruty, hmozdinky\ntmel, srouby\n1x LED zdroj" },
                    { p: "kontrola teh.\nodecty energii\nvymena sanitarni techniky\noprava satnich skrinek\nzapravovani der v omitce", m: "1x baterie, silikon\npanty, kovani\nsadra, tmel" },
                    { p: "kontrola teh.\noprava zamku dveri\ndoplneni spoj. materialu\ncisteni podlahove vpusti", m: "zamek, kovani\nspoj. mat\ntesneni" }
                ];

                [7, 14, 21, 28].forEach((den, i) => {
                    let y = cy - (i * 102);
                    const safe = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    page.drawText(an, { x: cx, y: y, size: 9, font: font });
                    page.drawText(`${den}.${mesic}.`, { x: cx, y: y - 18, size: 11, font: font });
                    page.drawText(safe(PRACE[i].p), { x: 260, y: y, size: 10, font: font, lineHeight: 14 });
                    page.drawText(safe(PRACE[i].m), { x: 610, y: y - 14, size: 10, font: font, lineHeight: 14 });
                    page.drawText("1.0h", { x: 855, y: y, size: 11, font: font });
                    page.drawText("3.0h", { x: 855, y: y - 14, size: 11, font: font });
                });
                const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([await pdfDoc.save()], { type: 'application/pdf' }));
                link.download = `Vykaz_Kamil_Final.pdf`; link.click();
            } catch (e) { alert(e.message); }
        }
    </script>
</body>
</html>
