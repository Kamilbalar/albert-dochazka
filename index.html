<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albert Facility PRO - Originál PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-text-blue { text-shadow: 0 0 10px rgba(56, 189, 248, 0.8); }
        .neon-text-orange { text-shadow: 0 0 10px rgba(249, 115, 22, 0.8); }
        .toggle-checkbox:checked { right: 0; border-color: #f97316; }
        .toggle-checkbox:checked + .toggle-label { background-color: #c2410c; }
    </style>
</head>
<body class="bg-[#050b14] text-slate-100 p-4 font-sans text-sm pb-10 min-h-screen">

    <div class="max-w-md mx-auto glass-panel rounded-[2rem] shadow-2xl overflow-hidden relative">
        
        <div class="bg-gradient-to-r from-blue-900/50 to-cyan-900/30 p-5 border-b border-cyan-500/20 grid grid-cols-2 gap-2 text-center">
            <div>
                <div class="text-[8px] text-cyan-400 uppercase font-black tracking-widest mb-1 opacity-80">Reálný Paušál</div>
                <div class="text-xl font-digital font-bold text-white neon-text-blue" id="stat-hodiny">0h 0m</div>
            </div>
            <div class="border-l border-cyan-500/30 pl-2">
                <div class="text-[8px] text-orange-400 uppercase font-black tracking-widest mb-1 opacity-80">Práce Navíc (Šéf)</div>
                <div class="text-xl font-digital font-bold text-orange-400 neon-text-orange" id="stat-navic">0h 0m</div>
            </div>
        </div>

        <div class="p-6 space-y-6">
            
            <div class="bg-slate-800/30 p-4 rounded-2xl border border-slate-700/50">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-[9px] font-black text-cyan-400 uppercase tracking-widest">Manuální záznam</h2>
                    <button onclick="vymazatData()" class="text-[8px] bg-red-900/50 text-red-400 px-2 py-1 rounded border border-red-500/30">VYMAZAT MĚSÍC</button>
                </div>
                
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input type="date" id="datum-prace" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 rounded-xl text-cyan-100 outline-none text-xs">
                    <select id="prodejna" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 rounded-xl text-cyan-100 outline-none text-xs">
                        <option value="">Lokalita...</option>
                        <option value="171 - TŘEBÍČ">171 - Třebíč</option>
                        <option value="851 - TŘEBÍČ">851 - Třebíč</option>
                        <option value="403 - TŘEBÍČ">403 - Třebíč</option>
                        <option value="025 - BRNO">025 - Brno</option>
                        <option value="022 - BRNO">022 - Brno</option>
                        <option value="026 - BRNO">026 - Brno</option>
                        <option value="125 - ROSICE">125 - Rosice</option>
                        <option value="OKŘÍŠKY">Okříšky</option>
                        <option value="354 - J. HRADEC">354 - J. Hradec (Jen pro Šéfa)</option>
                    </select>
                </div>

                <div class="bg-slate-900/50 border border-slate-600/50 p-3 rounded-xl flex justify-between items-center mb-3">
                    <div class="text-[9px] font-bold text-orange-400 uppercase tracking-widest">Práce MIMO paušál (Šéf)</div>
                    <div class="relative inline-block w-10 h-5 align-middle select-none">
                        <input type="checkbox" id="typ-prace" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-slate-700 appearance-none cursor-pointer transition-all duration-300"/>
                        <label for="typ-prace" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-700 cursor-pointer"></label>
                    </div>
                </div>

                <div class="relative mb-2">
                    <textarea id="popis" rows="2" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 pr-10 rounded-xl text-cyan-50 outline-none text-xs" placeholder="Popis práce (nadiktuj)..."></textarea>
                    <button onclick="spustitDiktovani('popis')" class="absolute top-2 right-2 text-lg">🎙️</button>
                </div>

                <div class="relative mb-4">
                    <input id="material" type="text" class="w-full bg-slate-900/80 border border-slate-600/50 p-3 pr-10 rounded-xl text-emerald-100 outline-none text-xs" placeholder="Materiál z účtenky (nadiktuj)...">
                    <button onclick="spustitDiktovani('material')" class="absolute top-3 right-2 text-lg">🎙️</button>
                </div>

                <div id="timer-ui" class="bg-[#020617] p-4 rounded-xl text-center border border-cyan-500/30 hidden mb-4">
                    <div id="clock" class="text-4xl font-digital font-black text-white neon-text-blue">00:00:00</div>
                </div>
                
                <button id="btn-start" onclick="startPrace()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-black text-sm uppercase tracking-widest">START MĚŘENÍ</button>
                <button id="btn-stop" onclick="stopPrace()" class="hidden w-full bg-red-600 hover:bg-red-500 py-4 rounded-xl font-black text-sm uppercase tracking-widest">UKONČIT & ULOŽIT</button>

                <button onclick="generovatReportSefovi()" class="w-full text-orange-400 text-[10px] font-bold uppercase mt-4 text-center tracking-widest hover:underline">📋 Kopírovat výkaz pro Šéfa</button>
            </div>

            <div class="bg-amber-900/20 border border-amber-500/30 p-5 rounded-2xl relative">
                <h2 class="text-xs font-black text-amber-500 uppercase tracking-widest mb-4">🖨️ Zápis do originálního PDF</h2>
                
                <div class="mb-4 bg-slate-900/80 border border-amber-500/30 p-3 rounded-xl">
                    <label class="block text-[9px] font-bold text-amber-300 uppercase tracking-widest mb-2">1. Vyber prázdný PDF vzor od TSC</label>
                    <input type="file" id="pdf-template" accept="application/pdf" class="w-full text-xs text-slate-300">
                </div>

                <div class="space-y-4">
                    <select id="ai-prodejna" class="w-full bg-slate-900 border border-amber-500/50 p-3 rounded-xl text-amber-100 outline-none text-xs font-bold">
                        <option value="171 - TŘEBÍČ">171 - Třebíč (Pátky | 19h)</option>
                        <option value="851 - TŘEBÍČ">851 - Třebíč (Úterky | 32h)</option>
                        <option value="403 - TŘEBÍČ">403 - Třebíč (Čtvrtky | 19h)</option>
                        <option value="025 - BRNO">025 - Brno (Předposlední st | 3h)</option>
                        <option value="022 - BRNO">022 - Brno (Středy | 14h)</option>
                        <option value="026 - BRNO">026 - Brno (Středy | 14h)</option>
                        <option value="125 - ROSICE">125 - Rosice (Středy | 14h)</option>
                        <option value="OKŘÍŠKY">Okříšky (Předposlední čt | 3h)</option>
                    </select>

                    <input type="text" id="ai-cislo-an" placeholder="Zadej aktuální BÚ / Číslo AN" class="w-full bg-slate-900 border border-amber-500/50 p-3 rounded-xl text-amber-100 outline-none text-xs font-bold">
                    
                    <button id="btn-vygenerovat" onclick="vygenerujA_Vytiskni()" class="w-full bg-amber-600 hover:bg-amber-500 py-4 rounded-xl font-bold uppercase tracking-widest text-xs transition-all active:scale-95">
                        ⚙️ Zapsat a stáhnout hotové PDF
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let startTime = null; let timerInterval = null;
        
        // PRAVIDLA PRO BARÁKY
        const CILY = {
            "171 - TŘEBÍČ": { udrzba: 15, tech: 4, den: 5 }, 
            "851 - TŘEBÍČ": { udrzba: 16, tech: 16, den: 2 }, 
            "403 - TŘEBÍČ": { udrzba: 12, tech: 7, den: 4 }, 
            "022 - BRNO": { udrzba: 8, tech: 6, den: 3 }, 
            "026 - BRNO": { udrzba: 8, tech: 6, den: 3 }, 
            "125 - ROSICE": { udrzba: 8, tech: 6, den: 3 }, 
            "025 - BRNO": { udrzba: 2, tech: 1, den: 3, secondLast: true }, 
            "OKŘÍŠKY": { udrzba: 2, tech: 1, den: 4, secondLast: true } 
        };
        const POPISY = ["oprava obkladů", "čištění odpadů", "oprava dveří", "oprava skříněk", "zapravování, dotažení", "oprava poškozených regálů", "výměna baterie"];

        window.onload = () => {
            document.getElementById('datum-prace').value = new Date().toISOString().split('T')[0];
            vypocitejStatistiky();
            if (localStorage.getItem('active_timer')) { startTime = new Date(localStorage.getItem('active_timer')); rezimBehu(); }
        };

        function vymazatData() { if(confirm("Opravdu smazat?")) { localStorage.removeItem('albert_final_db'); location.reload(); } }

        function vypocitejStatistiky() {
            const db = JSON.parse(localStorage.getItem('albert_final_db') || "[]");
            const m = new Date().toISOString().slice(0, 7);
            let p = 0, n = 0;
            db.forEach(z => { if(z.datum.startsWith(m)) { if(z.typ==='navic') n += z.trvani; else p += z.trvani; } });
            document.getElementById('stat-hodiny').innerText = `${Math.floor(p/60)}h ${p%60}m`;
            document.getElementById('stat-navic').innerText = `${Math.floor(n/60)}h ${n%60}m`;
        }

        function spustitDiktovani(id) {
            const sr = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            sr.lang = 'cs-CZ'; sr.onresult = (e) => { document.getElementById(id).value += (document.getElementById(id).value ? " " : "") + e.results[0][0].transcript; };
            sr.start();
        }

        function startPrace() { startTime = new Date(); localStorage.setItem('active_timer', startTime.toISOString()); rezimBehu(); }
        function rezimBehu() {
            document.getElementById('btn-start').classList.add('hidden'); document.getElementById('btn-stop').classList.remove('hidden'); document.getElementById('timer-ui').classList.remove('hidden');
            timerInterval = setInterval(() => { document.getElementById('clock').innerText = new Date(new Date() - startTime).toISOString().substr(11, 8); }, 1000);
        }

        function stopPrace() {
            const pr = document.getElementById('prodejna').value;
            if(!pr) return alert("Vyber nejdřív lokalitu!");
            const db = JSON.parse(localStorage.getItem('albert_final_db') || "[]");
            db.push({
                datum: document.getElementById('datum-prace').value, prodejna: pr, popis: document.getElementById('popis').value,
                material: document.getElementById('material').value, typ: document.getElementById('typ-prace').checked ? 'navic' : 'pausal',
                trvani: Math.round((new Date() - startTime) / 60000)
            });
            localStorage.setItem('albert_final_db', JSON.stringify(db)); location.reload();
        }

        function generovatReportSefovi() {
            const db = JSON.parse(localStorage.getItem('albert_final_db') || "[]"); let t = "Výkaz víceprací:\n";
            db.filter(z => z.typ === 'navic').forEach(z => t += `- ${z.datum} | ${z.prodejna}: ${(z.trvani/60).toFixed(1)}h (${z.popis})\n`);
            navigator.clipboard.writeText(t).then(() => alert("Zkopírováno!"));
        }

        // ==========================================================
        // ⚙️ NOVÝ MOZEK PRO PŘÍMÝ ZÁPIS DO TVÉHO ORIGINÁLNÍHO PDF
        // ==========================================================
        async function vygenerujA_Vytiskni() {
            const fileInput = document.getElementById('pdf-template');
            if (!fileInput.files.length) {
                return alert("⚠️ Nejdřív musíš pod bodem 1 nahrát ten tvůj čistý PDF vzor!");
            }

            const pId = document.getElementById('ai-prodejna').value;
            const an = document.getElementById('ai-cislo-an').value;
            if(!an) return alert("Zadej Číslo AN!");

            document.getElementById('btn-vygenerovat').innerText = "⏳ Generuji PDF...";

            // 1. Otevření originálního PDF
            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const { PDFDocument, rgb } = PDFLib;
            const pdfDoc = await PDFDocument.load(arrayBuffer);
            const page = pdfDoc.getPages()[0]; // Vezmeme první stranu

            // Načtení fontu s podporou Češtiny (Roboto)
            const fontBytes = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.66/fonts/Roboto/Roboto-Regular.ttf').then(res => res.arrayBuffer());
            const customFont = await pdfDoc.embedFont(fontBytes);

            const limit = { ...CILY[pId] };
            const db = JSON.parse(localStorage.getItem('albert_final_db') || "[]");
            const d = new Date(); const rok = d.getFullYear(); const mes = d.getMonth() + 1;
            const prefix = `${rok}-${String(mes).padStart(2, '0')}`;
            const pocetDni = new Date(rok, mes, 0).getDate();
            
            let dny = {};
            
            // Reálná práce
            db.filter(z => z.prodejna === pId && z.datum.startsWith(prefix) && z.typ === 'pausal').forEach(z => {
                let den = parseInt(z.datum.split('-')[2]);
                if(!dny[den]) dny[den] = { u: 0, t: 0, p: [], m: [] };
                dny[den].u += (z.trvani / 60);
                if(z.popis) dny[den].p.push(z.popis);
                if(z.material) dny[den].m.push(z.material);
                limit.udrzba -= (z.trvani / 60); 
            });

            if (limit.udrzba < 0) limit.udrzba = 0;

            // AI Plánování
            let dnyVhodne = [];
            for (let i = 1; i <= pocetDni; i++) { if (new Date(rok, mes-1, i).getDay() === limit.den) dnyVhodne.push(i); }
            if (limit.secondLast && dnyVhodne.length >= 2) dnyVhodne = [dnyVhodne[dnyVhodne.length - 2]];

            let h_u = limit.udrzba > 0 ? limit.udrzba / dnyVhodne.length : 0;
            let h_t = limit.tech > 0 ? limit.tech / dnyVhodne.length : 0;

            dnyVhodne.forEach(den => {
                if(!dny[den]) dny[den] = { u: 0, t: 0, p: [], m: [] };
                if(h_u > 0) { dny[den].u += h_u; dny[den].p.push(POPISY[Math.floor(Math.random()*POPISY.length)]); dny[den].m.push("Spoj. mat"); }
                if(h_t > 0) { dny[den].t += h_t; }
            });

            // ----------------------------------------------------------
            // 🗺️ SOUŘADNICE PRO TISK (Můžeš upravit, pokud to nesedí)
            // Bod 0,0 je vlevo DOLE. Čím vyšší Y, tím výše na stránce to je.
            // ----------------------------------------------------------
            const cerna = rgb(0, 0, 0);
            
            // Hlavička (Objekt a Období)
            page.drawText(pId, { x: 120, y: 672, size: 10, font: customFont, color: cerna });
            page.drawText(`${mes} / ${rok}`, { x: 420, y: 672, size: 10, font: customFont, color: cerna });

            // Tabulka (Souřadnice prvního řádku a mezera mezi nimi)
            let startY = 560; // Výška, kde začíná první řádek
            let radekMezera = 55; // Vzdálenost mezi jednotlivými dny směrem dolů

            let i = 0;
            Object.keys(dny).sort((a,b)=>a-b).forEach(den => {
                let r = dny[den];
                let aktualniY = startY - (i * radekMezera);
                let jeOdecet = (den > 14 && den < 22) ? " + odečty" : "";
                
                // Sloupec 1: Číslo AN a Datum
                page.drawText(an, { x: 40, y: aktualniY + 15, size: 10, font: customFont, color: cerna });
                page.drawText(`${den}.${mes}.`, { x: 40, y: aktualniY, size: 11, font: customFont, color: cerna });

                // Sloupec 3: Popis práce
                if (r.t > 0) page.drawText(`Kontrola teh. a vyhr. zař${jeOdecet}`, { x: 180, y: aktualniY + 15, size: 9, font: customFont, color: cerna });
                if (r.u > 0) page.drawText(r.p.join(', ').substring(0, 45), { x: 180, y: aktualniY, size: 9, font: customFont, color: cerna });

                // Sloupec 4: Materiál
                if (r.u > 0) page.drawText(r.m.filter(x=>x).join(', ').substring(0, 20), { x: 380, y: aktualniY, size: 9, font: customFont, color: cerna });

                // Sloupec 5: Hodiny
                if (r.t > 0) page.drawText(`${r.t.toFixed(1).replace('.',',')}h`, { x: 500, y: aktualniY + 15, size: 12, font: customFont, color: cerna });
                if (r.u > 0) page.drawText(`${r.u.toFixed(1).replace('.',',')}h`, { x: 500, y: aktualniY, size: 12, font: customFont, color: cerna });

                i++;
            });

            // 3. Uložení a Stažení hotového PDF do telefonu/PC
            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Vykaz_${pId.split(' ')[0]}_${mes}_${rok}.pdf`;
            link.click();

            document.getElementById('btn-vygenerovat').innerText = "⚙️ Zapsat a stáhnout hotové PDF";
            alert("✅ PDF se stahuje! Otevři si ho a zkontroluj.");
        }
    </script>
</body>
</html>
